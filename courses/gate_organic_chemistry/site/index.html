    <script>
      window.COURSE_DATA = {"course": {"title": "GATE Organic Chemistry Study Workbench", "learner_level": "GATE Chemistry candidate", "active_scope": "Official GATE CY Organic Chemistry section only"}, "status": "ready", "lessons": [{"id": "stereochemistry", "order": 1, "title": "Stereochemistry and Reactivity", "module": "Stereochemistry", "syllabus_anchor": "Chirality and symmetry, absolute and relative configuration, topicity, stereoselective and stereospecific synthesis, conformational analysis, geometrical and optical isomerism, atropisomerism, and neighbouring group participation.", "concept_thread": {"id": "chirality_enantiomers", "label": "Chirality, mirror images, and enantiomers", "source_coverage": {"textbook": 2, "video": 2, "questions": 2}, "missing_source_types": [], "alignment_state": "source_backed", "alignment_score": 41.0, "evidence_ids": {"syllabus": ["stereochemistry:syllabus"], "textbook": ["openstax_orgchem_stereo_5_1", "openstax_orgchem_stereo_5_5"], "video": ["gate_organic_graph_stereochemistry_specific_rotation:139.91-203.86", "gate_organic_graph_stereochemistry_specific_rotation:277.68-348.28"], "questions": ["official_gate_cy_2025_0039", "official_gate_cy_2024_0021"]}}, "source_grounded_summary": "Study this lesson as the stereochemical control layer of the official Organic Chemistry syllabus. Use the textbook and video evidence before adding any mechanism-level explanation.", "textbook_evidence": [{"source_id": "openstax_organic_chemistry", "citation_label": "OpenStax Organic Chemistry, John McMurry, 10th edition, 5.1 Enantiomers and the Tetrahedral Carbon", "source_url": "https://openstax.org/books/organic-chemistry/pages/5-1-enantiomers-and-the-tetrahedral-carbon", "license": "CC BY-NC-SA 4.0", "section_title": "5.1 Enantiomers and the Tetrahedral Carbon", "page": null, "chunk_id": "openstax_orgchem_stereo_5_1", "text_preview": "A molecule that is not identical to its mirror image is chiral. OpenStax introduces enantiomers through tetrahedral carbon centers, mirror-image relationships, and the structural test for handedness.", "full_text": "What causes molecular handedness? Look at generalized molecules of the type CH 3 X, CH 2 XY, and CHXYZ shown in Figure 5.2 . On the left are three molecules, and on the right are their images reflected in a mirror. The CH 3 X and CH 2 XY molecules are identical to their mirror images and thus are not handed. If you make a molecular model of each molecule and its mirror image, you find that you can superimpose one on the other so that all atoms coincide. The CHXYZ molecule, by contrast, is not identical to its mirror image. You can’t superimpose a model of this molecule on a model of its mirror image for the same reason that you can’t superimpose a left hand on a right hand: they simply aren’t the same.\n\nFigure 5.2 Tetrahedral carbon atoms and their mirror images. Molecules of the type CH 3 X and CH 2 XY are identical to their mirror images, but a molecule of the type CHXYZ is not. A CHXYZ molecule is related to its mirror image in the same way a right hand is related to a left hand.\n\nA molecule that is not identical to its mirror image is a kind of stereoisomer ( Section 4.2 ) called an enantiomer (e- nan -tee-oh-mer, from the Greek enantio, meaning “opposite”). Enantiomers are related to each other as a right hand is related to a left hand and result whenever a tetrahedral carbon is bonded to four different substituents (one need not be H). For example, lactic acid (2-hydroxypropanoic acid) exists as a pair of enantiomers because there are four different groups (-H, -OH, -CH 3 , -CO 2 H) bonded to the central carbon atom. The enantiomers are called (+)-lactic acid and (-)-lactic acid. Both are found in sour milk, but only the (+) enantiomer occurs in muscle tissue.\n\nNo matter how hard you try, you can’t superimpose a molecule of (+)-lactic acid on a molecule of (-)-lactic acid. If any two groups match up, say -H and -CO 2 H, the remaining two groups don’t match ( Figure 5.3 ).\n\nFigure 5.3 Attempts at superimposing the mirror-image forms of lactic acid. (a) When the -H and -OH substituents match up, the -CO 2 H and -CH 3 substituents don’t; (b) when -CO 2 H and -CH 3 match up, -H and -OH don’t. Regardless of how the molecules are oriented, they aren’t identical.", "content_blocks": [{"type": "paragraph", "text": "What causes molecular handedness? Look at generalized molecules of the type CH 3 X, CH 2 XY, and CHXYZ shown in Figure 5.2 . On the left are three molecules, and on the right are their images reflected in a mirror. The CH 3 X and CH 2 XY molecules are identical to their mirror images and thus are not handed. If you make a molecular model of each molecule and its mirror image, you find that you can superimpose one on the other so that all atoms coincide. The CHXYZ molecule, by contrast, is not identical to its mirror image. You can’t superimpose a model of this molecule on a model of its mirror image for the same reason that you can’t superimpose a left hand on a right hand: they simply aren’t the same."}, {"type": "figure", "caption": "Figure 5.2 Tetrahedral carbon atoms and their mirror images. Molecules of the type CH 3 X and CH 2 XY are identical to their mirror images, but a molecule of the type CHXYZ is not. A CHXYZ molecule is related to its mirror image in the same way a right hand is related to a left hand.", "image_url": "https://openstax.org/apps/image-cdn/v1/f=webp/apps/archive/20260604.144757/resources/ea0210f47007c9dca0b66089bace537efb8982d5", "alt": "The figure shows condensed formulas, structures, and ball-and-stick models of C H 3 X, C H 2 X Y, and C H X Y Z along with their mirror images."}, {"type": "paragraph", "text": "A molecule that is not identical to its mirror image is a kind of stereoisomer ( Section 4.2 ) called an enantiomer (e- nan -tee-oh-mer, from the Greek enantio, meaning “opposite”). Enantiomers are related to each other as a right hand is related to a left hand and result whenever a tetrahedral carbon is bonded to four different substituents (one need not be H). For example, lactic acid (2-hydroxypropanoic acid) exists as a pair of enantiomers because there are four different groups (-H, -OH, -CH 3 , -CO 2 H) bonded to the central carbon atom. The enantiomers are called (+)-lactic acid and (-)-lactic acid. Both are found in sour milk, but only the (+) enantiomer occurs in muscle tissue."}, {"type": "figure", "caption": "", "image_url": "https://openstax.org/apps/image-cdn/v1/f=webp/apps/archive/20260604.144757/resources/691eef8f331622edfe544d197c1810c1d3fc5714", "alt": "Structure of lactic acid with a molecule of the general formula C H X Y Z. Ball-and-stick model and structure of (plus)-lactic acid with its mirror image, displaying (minus)-lactic acid."}, {"type": "paragraph", "text": "No matter how hard you try, you can’t superimpose a molecule of (+)-lactic acid on a molecule of (-)-lactic acid. If any two groups match up, say -H and -CO 2 H, the remaining two groups don’t match ( Figure 5.3 )."}, {"type": "figure", "caption": "Figure 5.3 Attempts at superimposing the mirror-image forms of lactic acid. (a) When the -H and -OH substituents match up, the -CO 2 H and -CH 3 substituents don’t; (b) when -CO 2 H and -CH 3 match up, -H and -OH don’t. Regardless of how the molecules are oriented, they aren’t identical.", "image_url": "https://openstax.org/apps/image-cdn/v1/f=webp/apps/archive/20260604.144757/resources/31713a43f02c4a3216433092dfb8e830aea04a9a", "alt": "Two pairs of lactic acid molecules. Pair a shows the positions of substituents mismatching except hydrogen and hydroxyl groups. Pair b shows substituents mismatching except methyl and carboxylic acid groups."}], "keywords": ["chiral", "enantiomers", "tetrahedral", "mirror", "stereochemistry", "configuration"], "lesson_ids": ["stereochemistry"], "matched_terms": ["curated_lesson_mapping"]}, {"source_id": "openstax_organic_chemistry", "citation_label": "OpenStax Organic Chemistry, John McMurry, 10th edition, 5.5 Sequence Rules for Specifying Configuration", "source_url": "https://openstax.org/books/organic-chemistry/pages/5-5-sequence-rules-for-specifying-configuration", "license": "CC BY-NC-SA 4.0", "section_title": "5.5 Sequence Rules for Specifying Configuration", "page": null, "chunk_id": "openstax_orgchem_stereo_5_5", "text_preview": "The R/S system assigns absolute configuration by ranking substituents around a stereocenter. The section gives the priority-rule logic needed before comparing stereochemical outcomes.", "full_text": "Structural drawings provide a visual representation of stereochemistry, but a written method for indicating the three-dimensional arrangement, or configuration , of substituents at a chirality center is also needed. The method used a set of sequence rules to rank the four groups attached to the chirality center and then looks at the handedness with which those groups are attached. Called the Cahn-Ingold-Prelog rules after the chemists who proposed them, the sequence rules are as follows:\n\nRULE 1 Look at the four atoms directly attached to the chirality center, and rank them according to atomic number. The atom with the highest atomic number has the highest ranking (first), and the atom with the lowest atomic number (usually hydrogen) has the lowest ranking (fourth). When different isotopes of the same element are compared, such as deuterium ( 2 H) and protium ( 1 H), the heavier isotope ranks higher than the lighter isotope. Thus, atoms commonly found in organic compounds have the following order.\n\nRULE 2 If a decision can’t be reached by ranking the first atoms in the substituent, look at the second, third, or fourth atoms away from the chirality center until the first difference is found. A -CH 2 CH 3 substituent and a -CH 3 substituent are equivalent by rule 1 because both have carbon as the first atom. By rule 2, however, ethyl ranks higher than methyl because ethyl has a carbon as its highest second atom, while methyl has only hydrogen as its second atom. Look at the following pairs of examples to see how the rule works:\n\nRULE 3 Multiple-bonded atoms are equivalent to the same number of single-bonded atoms. For example, an aldehyde substituent ( -CH═O -CH═O ), which has a carbon atom doubly bonded to one oxygen, is equivalent to a substituent having a carbon atom singly bonded to two oxygens:\n\nAs further examples, the following pairs are equivalent:\n\nHaving ranked the four groups attached to a chiral carbon, we describe the stereochemical configuration around the carbon by orienting the molecule so that the group with the lowest ranking (4) points directly away from us. We then look at the three remaining substituents, which now appear to radiate toward us like the spokes on a steering wheel ( Figure 5.8 ). If a curved arrow drawn from the highest to second-highest to third-highest ranked substituent (1 → 2 → 3) is clockwise, we say that the chirality center has the R configuration (Latin rectus, meaning “right”). If an arrow from 1 → 2 → 3 is counterclockwise, the chirality center has the S configuration (Latin sinister , meaning “left”). To remember these assignments, think of a car’s steering wheel when making a R ight (clockwise) turn.\n\nFigure 5.8 Assigning R and S configurations to chirality centers. When the molecule is oriented so that the lowest-ranked group ( 4 ) is toward the rear, the remaining three groups radiate toward the viewer like the spokes of a steering wheel. If the direction of travel 1 → 2 → 3 is clockwise (right turn), the center has the R configuration. If the direction of travel 1 → 2 → 3 is counterclockwise (left turn), the center is S .\n\nLook at (-)-lactic acid in Figure 5.9 for an example of how to assign configuration. Sequence rule 1 says that -OH is ranked 1 and -H is ranked 4, but it doesn’t allow us to distinguish between -CH 3 and -CO 2 H because both groups have carbon as their first atom. Sequence rule 2, however, says that -CO 2 H ranks higher than -CH 3 because O (the highest second atom in -CO 2 H) outranks H (the highest second atom in -CH 3 ). Now, turn the molecule so that the fourth-ranked group (-H) is oriented toward the rear, away from the observer. Since a curved arrow from 1 (-OH) to 2 (-CO 2 H) to 3 (-CH 3 ) is clockwise (right turn of the steering wheel), (-)-lactic acid has the R configuration. Applying the same procedure to (+)-lactic acid leads to the opposite assignment.\n\nFigure 5.9 Assigning configuration to (a) ( R )-(-)-lactic acid and (b) ( S )-(+)-lactic acid.\n\nFurther examples are provided by naturally occurring (-)-glyceraldehyde and (+)-alanine, which both have the S configuration as shown in Figure 5.10 . Note that the sign of optical rotation, (+) or (-), is not related to the R,S designation. ( S )-Glyceraldehyde happens to be levorotatory (-), and ( S )-alanine happens to be dextrorotatory (+). There is no simple correlation between R,S configuration and direction or magnitude of optical rotation.\n\nFigure 5.10 Assigning configuration to (a) (-)-glyceraldehyde. (b) (+)-alanine. Both happen to have the S configuration, although one is levorotatory and the other is dextrorotatory.\n\nOne additional point needs to be mentioned-the matter of absolute configuration . How do we know that the assignments of R and S configuration are correct in an absolute sense , rather than a relative, sense? Since there is no correlation between the R,S configuration and the direction or magnitude of optical rotation, how do we know that the R configuration belongs to the levorotatory enantiomer of lactic acid? This difficult question was finally solved in 1951, when an X-ray diffraction method was found for determining the absolute spatial arrangement of atoms in a molecule. Based on those results, we can say with certainty that the R , S conventions are correct.\n\nWorked Example 5.3 Assigning Configuration to Chirality Centers Orient each of the following drawings so that the lowest-ranked group is toward the rear, and then assign R or S configuration to each: Strategy It takes practice to be able to visualize and orient a chirality center in three dimensions. You might start by indicating where the observer must be located-180° opposite the lowest-ranked group. Then imagine yourself in the position of the observer, and redraw what you would see. Solution In (a) , you would be located in front of the page toward the top right of the molecule, and you would see group 2 to your left, group 3 to your right, and group 1 below you. This corresponds to an R configuration. In (b) , you would be located behind the page toward the top left of the molecule from your point of view, and you would see group 3 to your left, group 1 to your right, and group 2 below you. This also corresponds to an R configuration.\n\nWorked Example 5.4 Drawing the Three-Dimensional Structure of a Specific Enantiomer Draw a tetrahedral representation of ( R )-2-chlorobutane. Strategy Begin by ranking the four substituents bonded to the chirality center: (1) -Cl, (2) -CH 2 CH 3 , (3) -CH 3 , (4) -H. To draw a tetrahedral representation of the molecule, orient the lowest-ranked group (-H) away from you and imagine that the other three groups are coming out of the page toward you. Then, place the remaining three substituents such that the direction of travel 1 → 2 → 3 is clockwise (right turn), and tilt the molecule toward you to bring the rear hydrogen into view. Using molecular models is a real help in working problems of this sort. Solution\n\nProblem 5-7 Which member in each of the following sets ranks higher? (a) -H or -Br (b) -Cl or -Br (c) -CH 3 or -CH 2 CH 3 (d) -NH 2 or -OH (e) -CH 2 OH or -CH 3 (f) -CH 2 OH or -CH = O Problem 5-8 Rank each of the following sets of substituents: (a) -H, -OH, -CH 2 CH 3 , -CH 2 CH 2 OH (b) -CO 2 H, -CO 2 CH 3 , -CH 2 OH, -OH (c) -CN, -CH 2 NH 2 , -CH 2 NHCH 3 , -NH 2 (d) -SH, -CH 2 SCH 3 , -CH 3 , -SSCH 3 Problem 5-9 Orient each of the following drawings so that the lowest-ranked group is toward the rear, and then assign R or S configuration: (a) (b) (c) Problem 5-10 Assign R or S configuration to the chirality center in each of the following molecules: (a) (b) (c) Problem 5-11 Draw a tetrahedral representation of ( S )-2-pentanol (2-hydroxypentane). Problem 5-12 Assign R or S configuration to the chirality center in the following molecular model of the amino acid methionine (blue = N, yellow = S):", "content_blocks": [{"type": "paragraph", "text": "Structural drawings provide a visual representation of stereochemistry, but a written method for indicating the three-dimensional arrangement, or configuration , of substituents at a chirality center is also needed. The method used a set of sequence rules to rank the four groups attached to the chirality center and then looks at the handedness with which those groups are attached. Called the Cahn-Ingold-Prelog rules after the chemists who proposed them, the sequence rules are as follows:"}, {"type": "paragraph", "text": "RULE 1 Look at the four atoms directly attached to the chirality center, and rank them according to atomic number. The atom with the highest atomic number has the highest ranking (first), and the atom with the lowest atomic number (usually hydrogen) has the lowest ranking (fourth). When different isotopes of the same element are compared, such as deuterium ( 2 H) and protium ( 1 H), the heavier isotope ranks higher than the lighter isotope. Thus, atoms commonly found in organic compounds have the following order."}, {"type": "figure", "caption": "", "image_url": "https://openstax.org/apps/image-cdn/v1/f=webp/apps/archive/20260604.144757/resources/d4494b9d9e93d9a06f0db4aca584418416851f59", "alt": "The atoms are arranged in descending order of their ranking and atomic number as follows: B r, C l, S, P, O, N, C, 2 H, and 1 H."}, {"type": "paragraph", "text": "RULE 2 If a decision can’t be reached by ranking the al carbon, we describe the stereochemical configuration around the carbon by orienting the molecule so that the group with the lowest ranking (4) points directly away from us. We then look at the three remaining substituents, which now appear to radiate toward us like the spokes on a steering wheel ( Figure 5.8 ). If a curved arrow drawn from the highest to second-highest to third-highest ranked substituent (1 → 2 → 3) is clockwise, we say that the chirality center has the R configuration (Latin rectus, meaning “right”). If an arrow from 1 → 2 → 3 is counterclockwise, the chirality center has the S configuration (Latin sinister , meaning “left”). To remember these assignments, think of a car’s steering wheel when making a R ight (clockwise) turn."}, {"type": "figure", "caption": "Figure 5.8 Assigning R and S configurations to chirality centers. When the molecule is oriented so that the lowest-ranked group ( 4 ) is toward the rear, the remaining three groups radiate toward the viewer like the spokes of a steering wheel. If the direction of travel 1 → 2 → 3 is clockwise (right turn), the center has the R configuration. If the direction of travel 1 → 2 → 3 is counterclockwise (left turn), the center is S .", "image_url": "https://openstax.org/apps/image-cdn/v1/f=webp/apps/archive/20260604.144757/resources/0fb436033dd896bd19bc760c52806b4fd5b8063f", "alt": "Substituents in the compound form R configuration, depicted as a right turn of the steering wheel. Its mirror image forms S configuration, depicted as left turn of the steering wheel."}, {"type": "paragraph", "text": "Look at (-)-lactic acid in Figure 5.9 for an example of how to assign configuration. Sequence rule 1 says that -OH is ranked 1 and -H is ranked 4, but it doesn’t allow us to distinguish between -CH 3 and -CO 2 H because both groups have carbon as their first atom. Sequence rule 2, however, says that -CO 2 H ranks higher than -CH 3 because O (the highest second atom in -CO 2 H) outranks H (the highest second atom in -CH 3 ). Now, turn the molecule so that the fourth-ranked group (-H) is oriented toward the rear, away from the observer. Since a curved arrow from 1 (-OH) to 2 (-CO 2 H) to 3 (-CH 3 ) is clockwise (right turn of the steering wheel), (-)-lactic acid has the R configuration. Applying the same procedure to (+)-lactic acid leads to the opposite assignment."}, {"type": "figure", "caption": "Figure 5.9 Assigning configuration to (a) ( R )-(-)-lactic acid and (b) ( S )-(+)-lactic acid.", "image_url": "https://openstax.org/apps/image-cdn/v1/f=webp/apps/archive/20260604.144757/resources/9d735eb45ff80921e4e4dbd2658124fc9581c053", "alt": "Structure and ball-and-stick model of (minus)-lactic acid with R configuration. Its mirror image shows ball-and-stick model of (plus)-lactic acid with S configuration. The figure also shows structure of (plus)-lactic acid."}, {"type": "paragraph", "text": "Further examples are provided by naturally occurring (-)-glyceraldehyde and (+)-alanine, which both have the S configuration as shown in Figure 5.10 . Note that the sign of optical rotation, (+) or (-), is not related to the R,S designation. ( S )-Glyceraldehyde happens to be levorotatory (-), and ( S )-alanine happens to be dextrorotatory (+). There is no simple correlation between R,S configuration and direction or magnitude of optical rotation."}, {"type": "figure", "caption": "Figure 5.10 Assigning configuration to (a) (-)-glyceraldehyde. (b) (+)-alanine. Both happen to have the S configuration, although one is levorotatory and the other is dextrorotatory.", "image_url": "https://openstax.org/apps/image-cdn/v1/f=webp/apps/archive/20260604.144757/resources/2e34e20602f17714860b222edd832cbeb4d4a0c0", "alt": "The structures and ball-and-stick models of (S)-Glyceraldehyde [(S)-(minus)-2,3-dihydroxypropanal] and (S)-alanine [(S)-(plus)-2-aminopropanoic acid with their [alpha] D values equals minus 8.7 and plus 8.5, respectively."}, {"type": "paragraph", "text": "One additional point needs to be mentioned-the matter of absolute configuration . How do we know that the assignments of R and S configuration are correct in an absolute sense , rather than a relative, sense? Since there is no correlation between the R,S configuration and the direction or magnitude of optical rotation, how do we know that the R configuration belongs to the levorotatory enantiomer of lactic acid? This difficult question was finally solved in 1951, when an X-ray diffraction method was found for determining the absolute spatial arrangement of atoms in a molecule. Based on those results, we can say with certainty that the R , S conventions are correct."}, {"type": "paragraph", "text": "Worked Example 5.3 Assigning Configuration to Chirality Centers Orient each of the following drawings so that the lowest-ranked group is toward the rear, and then assign R or S configuration to each: Strategy It takes practice to be able to visualize and orient a chirality center in three dimensions. You might start by indicating where the observer must be located-180° opposite the lowest-ranked group. Then imagine yourself in the position of the observer, and redraw what you would see. Solution In (a) , you would be located in front of the page toward the top right of the molecule, and you would see group 2 to your left, group 3 to your right, and group 1 below you. This corresponds to an R configuration. In (b) , you would be located behind the page toward the top left of the molecule from your point of view, and you would see group 3 to your left, group 1 to your right, and group 2 below you. This also corresponds to an R configuration."}, {"type": "paragraph", "text": "Worked Example 5.4 Drawing the Three-Dimensional Structure of a Specific Enantiomer Draw a tetrahedral representation of ( R )-2-chlorobutane. Strategy Begin by ranking the four substituents bonded to the chirality center: (1) -Cl, (2) -CH 2 CH 3 , (3) -CH 3 , (4) -H. To draw a tetrahedral representation of the molecule, orient the lowest-ranked group (-H) away from you and imagine that the other three groups are coming out of the page toward you. Then, place the remaining three substituents such that the direction of travel 1 → 2 → 3 is clockwise (right turn), and tilt the molecule toward you to bring the rear hydrogen into view. Using molecular models is a real help in working problems of this sort. Solution"}, {"type": "paragraph", "text": "Problem 5-7 Which member in each of the following sets ranks higher? (a) -H or -Br (b) -Cl or -Br (c) -CH 3 or -CH 2 CH 3 (d) -NH 2 or -OH (e) -CH 2 OH or -CH 3 (f) -CH 2 OH or -CH = O Problem 5-8 Rank each of the following sets of substituents: (a) -H, -OH, -CH 2 CH 3 , -CH 2 CH 2 OH (b) -CO 2 H, -CO 2 CH 3 , -CH 2 OH, -OH (c) -CN, -CH 2 NH 2 , -CH 2 NHCH 3 , -NH 2 (d) -SH, -CH 2 SCH 3 , -CH 3 , -SSCH 3 Problem 5-9 Orient each of the following drawings so that the lowest-ranked group is toward the rear, and then assign R or S configuration: (a) (b) (c) Problem 5-10 Assign R or S configuration to the chirality center in each of the following molecules: (a) (b) (c) Problem 5-11 Draw a tetrahedral representation of ( S )-2-pentanol (2-hydroxypentane). Problem 5-12 Assign R or S configuration to the chirality center in the following molecular model of the amino acid methionine (blue = N, yellow = S):"}], "keywords": ["sequence", "rules", "configuration", "absolute", "stereocenter", "priority"], "lesson_ids": ["stereochemistry"], "matched_terms": ["curated_lesson_mapping"]}], "video_evidence": [{"source_id": "gate_organic_graph_stereochemistry_specific_rotation", "title": "Optical Activity - Specific Rotation & Enantiomeric Excess - Stereochemistry", "citation_label": "The Organic Chemistry Tutor optical activity and specific rotation lecture via VideoDB", "source_url": "https://www.youtube.com/watch?v=duGxp_XZzvw", "video_id": "m-z-019f9f53-86c6-79f3-8304-d9dabec3e2b5", "collection_id": "c-fae8a4fb-d45d-4489-9993-16b861216501", "timestamp_start": 139.91, "timestamp_end": 203.86, "timestamp_label": "02:19-03:23", "transcript_preview": "So the molecule on the left is called S lactic acid, whereas the molecule on the right, this is called R lactic acid. These two enantiomers, which are mirrored images of each other, they have different optical properties, but they have the same physical properties. So enantiomers have same physical properties, like boiling point, melting point density, solubility is the same. For these two isomers. However, their optical properties are different. The way they rotate plane polarized light is not the same. It turns out that the S isomer rotates light towards the right and the ART isomer rotates plane polarized light towards the left.", "evidence_mode": "videodb_spoken_word_search"}], "question_evidence": [{"question_id": "official_gate_cy_2025_0039", "citation_label": "Official GATE 2025 Chemistry question paper", "year": 2025, "source_url": "https://gate2026.iitg.ac.in/doc/download/2025/CY2025.pdf", "source_path": "resources/question_banks/official_gate/gate_cy_2025_question_paper.pdf", "page": 24, "prompt_preview": "Q.33 The specific rotation of enantiomerically pure ( S)-2-butanol is +14 . The specific rotation of enantiomeric mixture of 2 -butanol obtained from an asymmetric reduction of 2-butanone is found to be +7. The percentage of (R)-2-butanol present in the reaction mixture is _____ (in integer).", "keywords": ["specific", "rotation", "enantiomerically", "butanol", "enantiomeric", "mixture", "obtained", "asymmetric", "reduction", "butanone", "found", "percentage", "present", "reaction", "integer"], "matched_terms": ["specific rotation", "asymmetric"]}, {"question_id": "official_gate_cy_2024_0021", "citation_label": "Official GATE 2024 Chemistry question paper", "year": 2024, "source_url": "https://gate2026.iitg.ac.in/doc/download/2024/CY24S1.pdf", "source_path": "resources/question_banks/official_gate/gate_cy_2024_question_paper.pdf", "page": 12, "prompt_preview": "Q.15 Among the following, the chiral compound is (A) P (B) Q (C) R (D) S", "keywords": ["among", "following", "chiral", "compound"], "matched_terms": ["chiral"]}], "review_prompts": ["Can you identify the stereochemical relation before choosing a reaction pathway?", "Can you separate configurational effects from conformational effects?"], "readiness": {"state": "ready", "completeness": {"syllabus": true, "textbook": true, "video": true, "questions": true}, "source_states": {"syllabus": {"state": "source_backed", "label": "Source-backed", "message": "This lesson has processed source evidence."}, "textbook": {"state": "source_backed", "label": "Source-backed", "message": "This lesson has processed source evidence."}, "video": {"state": "source_backed", "label": "Source-backed", "message": "This lesson has processed source evidence."}, "questions": {"state": "source_backed", "label": "Source-backed", "message": "This lesson has processed source evidence."}}, "source_integrity_state": "source_backed", "evidence_completeness_score": 1.0, "missing_messages": []}, "mastery_state": "not_started"}, {"id": "reaction_mechanisms", "order": 2, "title": "Mechanistic Control and Reactive Intermediates", "module": "Reaction Mechanisms", "syllabus_anchor": "Kinetic versus thermodynamic control, Hammond postulate, Curtin-Hammett principle, mechanism determination, linear free-energy relationships, substitution, addition, elimination, reactive intermediates, and rearrangements.", "concept_thread": {"id": "mechanisms_and_intermediates", "label": "Reaction mechanisms and intermediates", "source_coverage": {"textbook": 2, "video": 3, "questions": 2}, "missing_source_types": [], "alignment_state": "source_backed", "alignment_score": 42.5, "evidence_ids": {"syllabus": ["reaction_mechanisms:syllabus"], "textbook": ["openstax_orgchem_mechanisms_6_2", "openstax_orgchem_mechanisms_6_10"], "video": ["gate_organic_pilot_reaction_mechanism_ifas:270.06-360.94", "gate_organic_pilot_reaction_mechanism_ifas:2520.03-2610.13", "gate_organic_pilot_reaction_mechanism_ifas:7474.11-7560.08"], "questions": ["official_gate_cy_2025_0033", "official_gate_cy_2025_0062"]}}, "source_grounded_summary": "Study this lesson as the decision layer for why a pathway is favored. Keep claims tied to mechanism evidence, product evidence, kinetics, or intermediate stability.", "textbook_evidence": [{"source_id": "openstax_organic_chemistry", "citation_label": "OpenStax Organic Chemistry, John McMurry, 10th edition, 6.2 How Organic Reactions Occur: Mechanisms", "source_url": "https://openstax.org/books/organic-chemistry/pages/6-2-how-organic-reactions-occur-mechanisms", "license": "CC BY-NC-SA 4.0", "section_title": "6.2 How Organic Reactions Occur: Mechanisms", "page": null, "chunk_id": "openstax_orgchem_mechanisms_6_2", "text_preview": "A reaction mechanism describes the individual steps by which reactants are converted into products. OpenStax frames mechanisms as bond-breaking and bond-forming events tracked with electron movement.", "full_text": "Having looked at the kinds of reactions that take place, let’s now see how they occur. An overall description of how a reaction occurs is called a reaction mechanism . A mechanism describes in detail exactly what takes place at each stage of a chemical transformation-which bonds are broken and in what order, which bonds are formed and in what order, and what the relative rates are for each step. A complete mechanism must also account for all reactants used and all products formed.\n\nAll chemical reactions involve bond-breaking and bond-making. When two molecules come together, react, and yield products, specific bonds in the reactant molecules are broken and specific bonds in the product molecules are formed. Fundamentally, there are two ways in which a covalent two-electron bond can break. A bond can break in an electronically unsymmetrical way so that both bonding electrons remain with one product fragment, leaving the other with a vacant orbital, or a bond can break in an electronically symmetrical way so that one electron remains with each product fragment. The unsymmetrical cleavage is said to be heterolytic , and the symmetrical cleavage is said to be homolytic .\n\nWe’ll develop this point in more detail later, but note for now that the movement of two electrons in the unsymmetrical process is indicated using a full-headed curved arrow ( ), whereas the movement of one electron in the symmetrical process is indicated using a half-headed, or “fishhook,” arrow ( ).\n\nJust as there are two ways in which a bond can break, there are two ways in which a covalent two-electron bond can form. A bond can form in an electronically unsymmetrical way if both bonding electrons are donated to the new bond by one reactant, or in a symmetrical way if one electron is donated by each reactant.\n\nProcesses that involve unsymmetrical bond-breaking and bond-making are called polar reactions . Polar reactions involve species that have an even number of electrons and thus have only electron pairs in their orbitals. Polar processes are by far the more common reaction type in both organic and biological chemistry, and a large part of this book is devoted to their description.\n\nProcesses that involve symmetrical bond-breaking and bond-making are called radical reactions . A radical , often called a free radical , is a neutral chemical species that contains an odd number of electrons and thus has a single, unpaired electron in one of its orbitals.\n\nIn addition to polar and radical reactions, there is a third, less commonly encountered process called a pericyclic reaction . Rather than explain pericyclic reactions now, though, we’ll look at them more carefully in Chapter 30.", "content_blocks": [{"type": "paragraph", "text": "Having looked at the kinds of reactions that take place, let’s now see how they occur. An overall description of how a reaction occurs is called a reaction mechanism . A mechanism describes in detail exactly what takes place at each stage of a chemical transformation-which bonds are broken and in what order, which bonds are formed and in what order, and what the relative rates are for each step. A complete mechanism must also account for all reactants used and all products formed."}, {"type": "paragraph", "text": "All chemical reactions involve bond-breaking and bond-making. When two molecules come together, react, and yield products, specific bonds in the reactant molecules are broken and specific bonds in the product molecules are formed. Fundamentally, there are two ways in which a covalent two-electron bond can break. A bond can break in an electronically unsymmetrical way so that both bonding electrons remain with one product fragment, leaving the other with a vacant orbital, or a bond can break in an electronically symmetrical way so that one electron remains with each product fragment. The unsymmetrical cleavage is said to be heterolytic , and the symmetrical cleavage is said to be homolytic ."}, {"type": "paragraph", "text": "We’ll develop this point in more detail later, but note for now that the movement of two electrons in the unsymmetrical process is indicated using a full-headed curved arrow ( ), whereas the movement of one electron in the symmetrical process is indicated using a half-headed, or “fishhook,” arrow ( )."}, {"type": "figure", "caption": "", "image_url": "https://openstax.org/apps/image-cdn/v1/f=webp/apps/archive/20260604.144757/resources/b23a7575ae41777f18d7770474ea204f58189e4e", "alt": "Two reactions of A B with a shared pair of electrons show unsymmetrical bond-breaking (full arrow) and symmetrical bond-breaking (fish hook arrows), respectively."}, {"type": "paragraph", "text": "Just as there are two ways in which a bond can break, there are two ways in which a covalent two-electron bond can form. A bond can form in an electronically unsymmetrical way if both bonding electrons are donated to the new bond by one reactant, or in a symmetrical way if one electron is donated by each reactant."}, {"type": "figure", "caption": "", "image_url": "https://openstax.org/apps/image-cdn/v1/f=webp/apps/archive/20260604.144757/resources/043b2271f5b3754c94f984657871f9a8a968ffc4", "alt": "Two reactions for the formation of A B with a shared pair of electrons show unsymmetrical bond-making (full arrow) and symmetrical bond-making (fish hook arrows), respectively."}, {"type": "paragraph", "text": "Processes that involve unsymmetrical bond-breaking and bond-making are called polar reactions . Polar reactions involve species that have an even number of electrons and thus have only electron pairs in their orbitals. Polar processes are by far the more common reaction type in both organic and biological chemistry, and a large part of this book is devoted to their description."}, {"type": "paragraph", "text": "Processes that involve symmetrical bond-breaking and bond-making are called radical reactions . A radical , often called a free radical , is a neutral chemical species that contains an odd number of electrons and thus has a single, unpaired electron in one of its orbitals."}, {"type": "paragraph", "text": "In addition to polar and radical reactions, there is a third, less commonly encountered process called a pericyclic reaction . Rather than explain pericyclic reactions now, though, we’ll look at them more carefully in Chapter 30."}], "keywords": ["mechanism", "reactions", "electron", "bond", "reactants", "products"], "lesson_ids": ["reaction_mechanisms"], "matched_terms": ["curated_lesson_mapping"]}, {"source_id": "openstax_organic_chemistry", "citation_label": "OpenStax Organic Chemistry, John McMurry, 10th edition, 6.10 Describing a Reaction: Intermediates", "source_url": "https://openstax.org/books/organic-chemistry/pages/6-10-describing-a-reaction-intermediates", "license": "CC BY-NC-SA 4.0", "section_title": "6.10 Describing a Reaction: Intermediates", "page": null, "chunk_id": "openstax_orgchem_mechanisms_6_10", "text_preview": "Reaction-coordinate diagrams distinguish transition states from intermediates. This supports the lesson's focus on kinetic reasoning, intermediate stability, and evidence for a proposed pathway.", "full_text": "How can we describe the carbocation formed in the first step of the reaction of ethylene with HBr? The carbocation is clearly different from the reactants, yet it isn’t a transition state and it isn’t a final product.\n\nWe call the carbocation, which exists only transiently during the course of the multistep reaction, a reaction intermediate . As soon as the intermediate is formed in the first step by reaction of ethylene with H + , it reacts further with Br - in a second step to give the final product, bromoethane. This second step has its own activation energy (Δ G ‡ ), its own transition state, and its own energy change (Δ G °). We can picture the second transition state as an activated complex between the electrophilic carbocation intermediate and the nucleophilic bromide anion, in which Br - donates a pair of electrons to the positively charged carbon atom as the new C-Br bond just starts to form.\n\nA complete energy diagram for the overall reaction of ethylene with HBr is shown in Figure 6.8 . In essence, we draw a diagram for each of the individual steps and then join them so that the carbocation product of step 1 is the reactant for step 2. As indicated in Figure 6.8 , the reaction intermediate lies at an energy minimum between steps. Because the energy level of the intermediate is higher than the level of either the reactant that formed it or the product it yields, the intermediate can’t normally be isolated. It is, however, more stable than its two neighboring transition states.\n\nFigure 6.8 An energy diagram for the reaction of ethylene with HBr. Two separate steps are involved, each with its own activation energy (Δ G ‡ ) and free-energy change (Δ G °). The overall Δ G ‡ for the complete reaction is the energy difference between reactants and the highest transition state (which corresponds to Δ G 1 ‡ in this case), and the overall Δ G ° for the reaction is the energy difference between reactants and final products.\n\nEach step in a multistep process can always be considered separately. Each step has its own Δ G ‡ and its own Δ G °. The overall activation energy that controls the rate of the reaction, however, is the energy difference between initial reactants and the highest transition state, regardless of which step it occurs in. The overall Δ G ° of the reaction is the energy difference between reactants and final products.\n\nThe biological reactions that take place in living organisms have the same energy requirements as reactions that take place in the laboratory and can be described in similar ways. They are, however, constrained by the fact that they must have low enough activation energies to occur at moderate temperatures, and they must release energy in relatively small amounts to avoid overheating the organism. These constraints can be met through the use of large, structurally complex, enzyme catalysts that alter the mechanism of a reaction to a pathway that can proceed through a series of small steps rather than one or two large steps. Thus, an energy diagram for a biological reaction might look like that in Figure 6.9 .\n\nFigure 6.9 Energy diagrams for a typical, enzyme-catalyzed biological reaction and an uncatalyzed laboratory reaction . The biological reaction involves many steps, each of which has a relatively small activation energy and small energy change. The end result is the same, however.\n\nWorked Example 6.3 Drawing a Reaction Energy Diagram Sketch an energy diagram for a one-step reaction that is fast and highly exergonic. Strategy A fast reaction has a small Δ G ‡ , and a highly exergonic reaction has a large negative Δ G °. Solution\n\nWorked Example 6.4 Drawing a Reaction Energy Diagram Sketch an energy diagram for a two-step exergonic reaction whose second step has a higher-energy transition state than its first step. Show Δ G ‡ and Δ G ° for the overall reaction. Strategy A two-step reaction has two transition states and an intermediate between them. The Δ G ‡ for the overall reaction is the energy change between reactants and the highest-energy transition state-the second one in this case. An exergonic reaction has a negative overall Δ G °. Solution\n\nProblem 6-13 Sketch an energy diagram for a two-step reaction in which both steps are exergonic and in which the second step has a higher-energy transition state than the first. Label the parts of the diagram corresponding to reactant, product, intermediate, overall Δ G ‡ , and overall Δ G °.", "content_blocks": [{"type": "paragraph", "text": "How can we describe the carbocation formed in the first step of the reaction of ethylene with HBr? The carbocation is clearly different from the reactants, yet it isn’t a transition state and it isn’t a final product."}, {"type": "figure", "caption": "", "image_url": "https://openstax.org/apps/image-cdn/v1/f=webp/apps/archive/20260604.144757/resources/ed10b6e09d79fa30d221fedd077f131e1c3c77cb", "alt": "A reaction mechanism shows ethene attacking hydrogen bromide to form a carbocation (labeled intermediate), which is attacked by a bromide ion to form ethyl bromide."}, {"type": "paragraph", "text": "We call the carbocation, which exists only transiently during the course of the multistep reaction, a reaction intermediate . As soon as the intermediate is formed in the first step by reaction of ethylene with H + , it reacts further with Br - in a second step to give the final product, bromoethane. This second step has its own activation energy (Δ G ‡ ), its own transition state, and its own energy change (Δ G °). We can picture the second transition state as an activated complex between the electrophilic carbocation intermediate and the nucleophilic bromide anion, in which Br - donates a pair of electrons to the positively charged carbon atom as the new C-Br bond just starts to form."}, {"type": "paragraph", "text": "A complete energy diagram for the overall reaction of ethylene with HBr is shown in Figure 6.8 . In essence, we draw a diagram for each of the individual steps and then join them so that the carbocation product of step 1 is the reactant for step 2. As indicated in Figure 6.8 , the reaction intermediate lies at an energy minimum between steps. Because the energy level of the intermediate is higher than the level of either the reactant that formed it or the product it yields, the intermediate can’t normally be isolated. It is, however, more stable than its two neighboring transition states."}, {"type": "figure", "caption": "Figure 6.8 An energy diagram for the reaction of ethylene with HBr. Two separate steps are involved, each with its own activation energy (Δ G ‡ ) and free-energy change (Δ G °). The overall Δ G ‡ for the complete reaction is the energy difference between reactants and the highest transition state (which corresponds to Δ G 1 ‡ in this case), and the overall Δ G ° for the reaction is the energy difference between reactants and final products.", "image_url": "https://openstax.org/apps/image-cdn/v1/f=webp/apps/archive/20260604.144757/resources/6da88a01383de5fd0291b93a6db6790e38c7cc9d", "alt": "Energy diagram for ethyl bromide formation shows two transition state peaks (first is higher), with net negative delta G naught."}, {"type": "paragraph", "text": "Each step in a multistep process can always be considered separately. Each step has its own Δ G ‡ and its own Δ G °. The overall activation energy that controls the rate of the reaction, however, is the energy difference between initial reactants and the highest transition state, regardless of which step it occurs in. The overall Δ G ° of the reaction is the energy difference between reactants and final products."}, {"type": "paragraph", "text": "The biological reactions that take place in living organisms have the same energy requirements as reactions that take place in the laboratory and can be described in similar ways. They are, however, constrained by the fact that they must have low enough activation energies to occur at moderate temperatures, and they must release energy in relatively small amounts to avoid overheating the organism. These constraints can be met through the use of large, structurally complex, enzyme catalysts that alter the mechanism of a reaction to a pathway that can proceed through a series of small steps rather than one or two large steps. Thus, an energy diagram for a biological reaction might look like that in Figure 6.9 ."}, {"type": "figure", "caption": "Figure 6.9 Energy diagrams for a typical, enzyme-catalyzed biological reaction and an uncatalyzed laboratory reaction . The biological reaction involves many steps, each of which has a relatively small activation energy and small energy change. The end result is the same, however.", "image_url": "https://openstax.org/apps/image-cdn/v1/f=webp/apps/archive/20260604.144757/resources/dc3e7cd31d405f66de01a1ef1ff4bcf4425513b3", "alt": "Two energy diagrams for the same reaction; catalyzed shows multiple transition states each with low activation barrier, uncatalyzed shows single transition state with high activation barrier."}, {"type": "paragraph", "text": "Worked Example 6.3 Drawing a Reaction Energy Diagram Sketch an energy diagram for a one-step reaction that is fast and highly exergonic. Strategy A fast reaction has a small Δ G ‡ , and a highly exergonic reaction has a large negative Δ G °. Solution"}, {"type": "paragraph", "text": "Worked Example 6.4 Drawing a Reaction Energy Diagram Sketch an energy diagram for a two-step exergonic reaction whose second step has a higher-energy transition state than its first step. Show Δ G ‡ and Δ G ° for the overall reaction. Strategy A two-step reaction has two transition states and an intermediate between them. The Δ G ‡ for the overall reaction is the energy change between reactants and the highest-energy transition state-the second one in this case. An exergonic reaction has a negative overall Δ G °. Solution"}, {"type": "paragraph", "text": "Problem 6-13 Sketch an energy diagram for a two-step reaction in which both steps are exergonic and in which the second step has a higher-energy transition state than the first. Label the parts of the diagram corresponding to reactant, product, intermediate, overall Δ G ‡ , and overall Δ G °."}], "keywords": ["intermediates", "transition", "state", "kinetic", "energy", "reaction"], "lesson_ids": ["reaction_mechanisms"], "matched_terms": ["curated_lesson_mapping"]}], "video_evidence": [{"source_id": "gate_organic_pilot_reaction_mechanism_ifas", "title": "Reaction Mechanism | Organic Chemistry | CSIR NET Chemistry | IFAS", "citation_label": "IFAS reaction mechanism video via VideoDB", "source_url": "https://www.youtube.com/watch?v=hkh70pllOlo", "video_id": "m-z-019f9deb-0e6e-7533-b064-09fa80d54428", "collection_id": "c-fae8a4fb-d45d-4489-9993-16b861216501", "timestamp_start": 2520.03, "timestamp_end": 2610.13, "timestamp_label": "42:00-43:30", "transcript_preview": "बीच का इंटरमीडिएट है वो ऑप्टिकली एक्टिव है या इनएक्टिव सर देखिये आपने अभी न 1 ही फॉर्म बनाई है। आप इसका रेजुनेटिंग स्ट्रक्चर भी तो बना सकते हैं। बात तो सही है। तो अगर मैं रेजोनेंस हाइब्रिड स्ट्रक्चर को ड्रा करूँ तो ऑक्सीजन ऑक्सीजन ऐसा बीच में पॉजिटिव। देखिये सिर कितना फर्स्ट क्लास इसमें प्लेन ऑफ सिमिट्री प्रेजेंट है तो हम क्या कहेंगे हम ये कहेंगे सिर कि इसमें पी ओ एस प्रेजेंट है। अब की तो शार्ट ट्रिक लगा लीजिये। अगर आपका इन्टरमीडिएट ऑप्टिकली इन एक्टिव बनता है न तो डायरेक्ट बता दीजिये की आपका प्रोडक्ट भी क्या होगा ऑप्टिकली इन एक्टिव होगा। अच्छा अच्छा मतलब आंसर तो मिल गया लेकिन ऑप्टिकली इनएक्टिव कैसे बनेगा। क्योंकि जो प्रोडक्ट्स होंगे रेस्मिक मिक्चर होंगे। 1 बार अटैक यहाँ हो सकता है और 1 बार अटैक यहाँ हो सकता है। दोनों प्रोडक्ट्स को देखने की कोशिश करिएगा। देखो अगर ऊपर वाले सेंटर पर एसिटेट अटैक करेगा तो बेलोदी प्लेन और अबवधीप्लेन और अगर नीचे वाले सेंटर से ओपन करेगा तो यहाँ पर बेलोदी प्लेन और यहाँ पर अबवदीप्लेन जल्दी बताएगा। अगर ये 2 प्रोडक्ट्स हैं एक्स और वाई तो इनके बीच में क्या रिलेशनशिप है। अगर मैंने 2 प्रोडक्ट्स बनाये, 1 ऊपर वाले सेंटर से अटैक करके बनाया, 1 नीचे वाले सेंटर से अटैक करके बनाया तो इन दोनों में क्या रिलेशनशिप", "evidence_mode": "videodb_spoken_word_search"}], "question_evidence": [{"question_id": "official_gate_cy_2025_0033", "citation_label": "Official GATE 2025 Chemistry question paper", "year": 2025, "source_url": "https://gate2026.iitg.ac.in/doc/download/2025/CY2025.pdf", "source_path": "resources/question_banks/official_gate/gate_cy_2025_question_paper.pdf", "page": 22, "prompt_preview": "Q.27 Choose the correct option(s) with regard to mechanism of the following transformation. (A) It proceeds through divinyl cyclopropane rearrangement (B) It involves a diradical intermediate (C) It proceeds through di--methane rearrangement (D) It proceeds through [2+2+2] cycloaddition reaction", "keywords": ["choose", "correct", "options", "regard", "mechanism", "following", "transformation", "proceeds", "through", "divinyl", "cyclopropane", "rearrangement", "involves", "diradical", "intermediate", "methane", "cycloaddition", "reaction"], "matched_terms": ["mechanism", "transformation", "rearrangement", "intermediate"]}, {"question_id": "official_gate_cy_2025_0062", "citation_label": "Official GATE 2025 Chemistry question paper", "year": 2025, "source_url": "https://gate2026.iitg.ac.in/doc/download/2025/CY2025.pdf", "source_path": "resources/question_banks/official_gate/gate_cy_2025_question_paper.pdf", "page": 41, "prompt_preview": "Q.54 The process(es) and/or intermediate(s) through which the following transformation proceeds is/are (A) 1,2-methide shift (B) 1,3-methide shift (C) non-classical carbocation (D) tertiary carbocation", "keywords": ["processes", "andor", "intermediates", "through", "which", "following", "transformation", "proceeds", "isare", "methide", "shift", "classical", "carbocation", "tertiary"], "matched_terms": ["transformation", "intermediate"]}], "review_prompts": ["What evidence would distinguish a kinetic product from a thermodynamic product?", "Which intermediate or transition-state argument is actually being tested?"], "readiness": {"state": "ready", "completeness": {"syllabus": true, "textbook": true, "video": true, "questions": true}, "source_states": {"syllabus": {"state": "source_backed", "label": "Source-backed", "message": "This lesson has processed source evidence."}, "textbook": {"state": "source_backed", "label": "Source-backed", "message": "This lesson has processed source evidence."}, "video": {"state": "source_backed", "label": "Source-backed", "message": "This lesson has processed source evidence."}, "questions": {"state": "source_backed", "label": "Source-backed", "message": "This lesson has processed source evidence."}}, "source_integrity_state": "source_backed", "evidence_completeness_score": 1.0, "missing_messages": []}, "mastery_state": "not_started"}, {"id": "organic_synthesis", "order": 3, "title": "Functional-Group Synthesis and Selectivity", "module": "Organic Synthesis", "syllabus_anchor": "Reactions, mechanisms and selectivity of major functional groups; main-group reagents; coupling reactions; retrosynthesis; atom economy; umpolung; chemo-, regio- and stereoselectivity; protection/deprotection; asymmetric synthesis; enolate and carbonyl stereoselective additions.", "concept_thread": {"id": "synthesis_planning", "label": "Synthesis planning and reaction sequences", "source_coverage": {"textbook": 2, "video": 2, "questions": 5}, "missing_source_types": [], "alignment_state": "source_backed", "alignment_score": 42.0, "evidence_ids": {"syllabus": ["organic_synthesis:syllabus"], "textbook": ["openstax_orgchem_synthesis_9_matters", "openstax_orgchem_synthesis_19_11"], "video": ["gate_organic_pilot_organic_synthesis_retrosynthesis:180.12-270.14", "gate_organic_pilot_organic_synthesis_retrosynthesis:90.03-180.12"], "questions": ["official_gate_cy_2025_0031", "official_gate_cy_2025_0061", "official_gate_cy_2025_0049", "official_gate_cy_2025_0051", "official_gate_cy_2025_0052"]}}, "source_grounded_summary": "Study this lesson as a synthesis planning layer. The app should connect reactions to selectivity, disconnections, reagent choice, and evidence-backed practice.", "textbook_evidence": [{"source_id": "openstax_organic_chemistry", "citation_label": "OpenStax Organic Chemistry, John McMurry, 10th edition, Chemistry Matters: The Art of Organic Synthesis", "source_url": "https://openstax.org/books/organic-chemistry/pages/9-chemistry-matters-the-art-of-organic-synthesis", "license": "CC BY-NC-SA 4.0", "section_title": "Chemistry Matters: The Art of Organic Synthesis", "page": null, "chunk_id": "openstax_orgchem_synthesis_9_matters", "text_preview": "OpenStax presents synthesis as planned construction of complex molecules, where route design often forces chemists to revise reactions and discover new chemical principles.", "full_text": "Chemistry Matters - The Art of Organic Synthesis 9 • Chemistry Matters 9 • Chemistry Matters Figure 9.8 Vitamin B 12 has been synthesized from scratch in the laboratory, but the bacteria growing on sludge from municipal sewage plants do a much better job. (credit: “Aeration and sludge-wasting” by U.S. Department of Agriculture/Flickr, Public Domain) If you think some of the synthesis problems at the end of this chapter are difficult, try devising a synthesis of vitamin B 12 starting only from simple substances you can buy in a chemical catalog. This extraordinary achievement was reported in 1973 as the culmination of a collaborative effort headed by Robert B. Woodward of Harvard University and Albert Eschenmoser of the Swiss Federal Institute of Technology in Zürich. More than 100 graduate students and postdoctoral associates contributed to the work, which took more than a decade to complete. Why put such extraordinary effort into the laboratory synthesis of a molecule so easily obtained from natural sources? There are many reasons. On a basic human level, a chemist might be motivated primarily by the challenge, much as a climber might be challenged by the ascent of a difficult peak. Beyond the pure challenge, the completion of a difficult synthesis is also valuable in that it establishes new standards and raises the field to a new level. If vitamin B 12 can be made, then why can’t any molecule found in nature be made? Indeed, the decades that have passed since the work of Woodward and Eschenmoser have seen the laboratory synthesis of many enormously complex and valuable substances. Sometimes these substances-for instance, the anticancer compound paclitaxel, trade named Taxol-are not easily available in nature, so laboratory synthesis is the only method for obtaining larger quantities. But perhaps the most important reason for undertaking a complex synthesis is that, in so doing, new reactions and new chemistry are discovered. It invariably happens in a complex synthesis that a point is reached at which the planned route fails. At such a time, the only alternatives are either to quit or to devise a way around the difficulty. New reactions and new principles come from such situations, and it is in this way that the science of organic chemistry grows richer. In the synthesis of vitamin B 12 , for example, unexpected findings emerged that led to the understanding of an entire new class of reactions-the pericyclic reactions that are the subject of Chapter 30 in this book. From synthesizing vitamin B 12 to understanding pericyclic reactions-no one could have possibly predicted such a link at the beginning of the synthesis, but that is the way of science.", "content_blocks": [{"type": "paragraph", "text": "Chemistry Matters - The Art of Organic Synthesis 9 • Chemistry Matters 9 • Chemistry Matters Figure 9.8 Vitamin B 12 has been synthesized from scratch in the laboratory, but the bacteria growing on sludge from municipal sewage plants do a much better job. (credit: “Aeration and sludge-wasting” by U.S. Department of Agriculture/Flickr, Public Domain) If you think some of the synthesis problems at the end of this chapter are difficult, try devising a synthesis of vitamin B 12 starting only from simple substances you can buy in a chemical catalog. This extraordinary achievement was reported in 1973 as the culmination of a collaborative effort headed by Robert B. Woodward of Harvard University and Albert Eschenmoser of the Swiss Federal Institute of Technology in Zürich. More than 100 graduate students and postdoctoral associates contributed to the work, which took more than a decade to complete. Why put such extraordinary effort into the laboratory synthesis of a molecule so easily obtained from natural sources? There are many reasons. On a basic human level, a chemist might be motivated primarily by the challenge, much as a climber might be challenged by the ascent of a difficult peak. Beyond the pure challenge, the completion of a difficult synthesis is also valuable in that it establishes new standards and raises the field to a new level. If vitamin B 12 can be made, then why can’t any molecule found in nature be made? Indeed, the decades that have passed since the work of Woodward and Eschenmoser have seen the laboratory synthesis of many enormously complex and valuable substances. Sometimes these substances-for instance, the anticancer compound paclitaxel, trade named Taxol-are not easily available in nature, so laboratory synthesis is the only method for obtaining larger quantities. But perhaps the most important reason for undertaking a complex synthesis is that, in so doing, new reactions and new chemistry are discovered. It invariably happens in a complex synthesis that a point is reached at which the planned route fails. At such a time, the only alternatives are either to quit or to devise a way around the difficulty. New reactions and new principles come from such situations, and it is in this way that the science of organic chemistry grows richer. In the synthesis of vitamin B 12 , for example, unexpected findings emerged that led to the understanding of an entire new class of reactions-the pericyclic reactions that are the subject of Chapter 30 in this book. From synthesizing vitamin B 12 to understanding pericyclic reactions-no one could have possibly predicted such a link at the beginning of the synthesis, but that is the way of science."}], "keywords": ["synthesis", "route", "reactions", "complex", "molecules", "planning"], "lesson_ids": ["organic_synthesis"], "matched_terms": ["curated_lesson_mapping"]}, {"source_id": "openstax_organic_chemistry", "citation_label": "OpenStax Organic Chemistry, John McMurry, 10th edition, 19.11 Nucleophilic Addition of Phosphorus Ylides: The Wittig Reaction", "source_url": "https://openstax.org/books/organic-chemistry/pages/19-11-nucleophilic-addition-of-phosphorus-ylides-the-wittig-reaction", "license": "CC BY-NC-SA 4.0", "section_title": "19.11 Nucleophilic Addition of Phosphorus Ylides: The Wittig Reaction", "page": null, "chunk_id": "openstax_orgchem_synthesis_19_11", "text_preview": "The Wittig reaction is presented as a carbonyl-to-alkene transformation using a phosphorus ylide. It is useful evidence for functional-group synthesis and selectivity planning.", "full_text": "Aldehydes and ketones are converted into alkenes by means of a nucleophilic addition called the Wittig reaction , after the German chemist Georg Wittig who won the 1979 Nobel Prize in Chemistry. The reaction has no direct biological counterpart but is important both because of its wide use in drug manufacture and because of its mechanistic similarity to reactions of the coenzyme thiamin diphosphate, which we’ll see in Section 29.6 .\n\nIn the Wittig reaction, a triphenylphosphorus ylide, R 2 C - - P + Ph 3 R 2 C - - P + Ph 3 also called a phosphorane and sometimes written in the resonance form R 2 C═ P(Ph) 3 R 2 C═ P(Ph) 3 , adds to an aldehyde or ketone to yield a four-membered cyclic intermediate called an oxaphosphetane. The oxaphosphetane is not isolated, but instead spontaneously decomposes to give an alkene plus triphenylphosphine oxide, O═ PPh 3 O═ PPh 3 . In effect, the oxygen atom of the aldehyde or ketone and the R 2 C= bonded to phosphorus exchange places. (An ylide -pronounced ill -id-is a neutral, dipolar compound with adjacent positive and negative charges.)\n\nThe initial addition takes place by different pathways depending on the structure of the reactants and the exact experimental conditions. One pathway involves a one-step cycloaddition process analogous to the Diels-Alder cycloaddition reaction ( Section 14.4 ). The other pathway involves a nucleophilic addition reaction to give a dipolar intermediate called a betaine ( bay -ta-een), which undergoes ring closure.\n\nThe phosphorus ylides necessary for Wittig reaction are easily prepared by S N 2 reaction of primary (and some secondary) alkyl halides with triphenylphosphine, (Ph) 3 P, followed by treatment with base. Triphenylphosphine is a good nucleophile in S N 2 reactions, and yields of the resultant alkyltriphenylphosphonium salts are high. Because of the positive charge on phosphorus, the hydrogen on the neighboring carbon is weakly acidic and can be removed by a strong base such as butyllithium (BuLi) to generate the neutral ylide. For example:\n\nThe Wittig reaction is extremely general, and a great many monosubstituted, disubstituted, and trisubstituted alkenes can be prepared from the appropriate combination of phosphorane and aldehyde or ketone. Tetrasubstituted alkenes, however, can’t be prepared this way because of steric hindrance.\n\nThe real value of the Wittig reaction is that it yields a pure alkene of predictable structure. The C═C C═C bond in the product is always exactly where the C═O C═O group was in the reactant, and no alkene isomers (except E , Z isomers) are formed. For example, Wittig reaction of cyclohexanone with methylenetriphenylphosphorane yields only the single alkene product methylenecyclohexane. By contrast, addition of methylmagnesium bromide to cyclohexanone, followed by dehydration with POCl 3 , yields a roughly 9 : 1 mixture of two alkenes.\n\nWittig reactions are used commercially in the synthesis of numerous pharmaceutical products. For example, the German chemical company BASF prepares vitamin A by using a Wittig reaction between a 15-carbon ylide and a 5-carbon aldehyde.\n\nWorked Example 19.3 Synthesizing an Alkene Using a Wittig Reaction What carbonyl compound and what phosphorus ylide might you use to prepare 3-ethyl-2-pentene? Strategy An aldehyde or ketone reacts with a phosphorus ylide to yield an alkene in which the oxygen atom of the carbonyl reactant is replaced by the ═CR 2 of the ylide. Preparation of the phosphorus ylide itself usually involves S N 2 reaction of a primary alkyl halide with triphenylphosphine, so the ylide is typically primary, RCH═ P(Ph) 3 RCH═ P(Ph) 3 . This means that the disubstituted alkene carbon in the product comes from the carbonyl reactant, while the monosubstituted alkene carbon comes from the ylide. Solution\n\nProblem 19-16 What carbonyl compound and what phosphorus ylide might you use to prepare each of the following compounds? (a) (b) (c) (d) (e) (f) Problem 19-17 β -Carotene, a yellow food-coloring agent and dietary source of vitamin A can be prepared by a double Wittig reaction between 2 equivalents of β -ionylideneacetaldehyde and a diylide. Show the structure of the β -carotene product.", "content_blocks": [{"type": "paragraph", "text": "Aldehydes and ketones are converted into alkenes by means of a nucleophilic addition called the Wittig reaction , after the German chemist Georg Wittig who won the 1979 Nobel Prize in Chemistry. The reaction has no direct biological counterpart but is important both because of its wide use in drug manufacture and because of its mechanistic similarity to reactions of the coenzyme thiamin diphosphate, which we’ll see in Section 29.6 ."}, {"type": "paragraph", "text": "In the Wittig reaction, a triphenylphosphorus ylide, R 2 C - - P + Ph 3 R 2 C - - P + Ph 3 also called a phosphorane and sometimes written in the resonance form R 2 C═ P(Ph) 3 R 2 C═ P(Ph) 3 , adds to an aldehyde or ketone to yield a four-membered cyclic intermediate called an oxaphosphetane. The oxaphosphetane is not isolated, but instead spontaneously decomposes to give an alkene plus triphenylphosphine oxide, O═ PPh 3 O═ PPh 3 . In effect, the oxygen atom of the aldehyde or ketone and the R 2 C= bonded to phosphorus exchange places. (An ylide -pronounced ill -id-is a neutral, dipolar compound with adjacent positive and negative charges.)"}, {"type": "figure", "caption": "", "image_url": "https://openstax.org/apps/image-cdn/v1/f=webp/apps/archive/20260604.144757/resources/65e9368151273bd8f815a8d35bbcc3e6305930c4", "alt": "An aldehyde or ketone reacts with ylide to form an oxaphosphetane. This further forms alkene plus triphenylphosphine oxide."}, {"type": "paragraph", "text": "The initial addition takes place by different pathways depending on the structure of the reactants and the exact experimental conditions. One pathway involves a one-step cycloaddition process analogous to the Diels-Alder cycloaddition reaction ( Section 14.4 ). The other pathway involves a nucleophilic addition reaction to give a dipolar intermediate called a betaine ( bay -ta-een), which undergoes ring closure."}, {"type": "figure", "caption": "", "image_url": "https://openstax.org/apps/image-cdn/v1/f=webp/apps/archive/20260604.144757/resources/e2e42986bc368006462b641d4f3155c142648820", "alt": "A cyclic reversible reaction where aldehyde or ketone reacts with ylide, to form betaine (intermediate), which further forms oxaphosphetane. This transforms back to the reactants, aldehyde or ketone and ylide."}, {"type": "paragraph", "text": "The phosphorus ylides necessary for Wittig reaction are easily prepared by S N 2 reaction of primary (and some secondary) alkyl halides with triphenylphosphine, (Ph) 3 P, followed by treatment with base. Triphenylphosphine is a good nucleophile in S N 2 reactions, and yields of the resultant alkyltriphenylphosphonium salts are high. Because of the positive charge on phosphorus, the hydrogen on the neighboring carbon is weakly acidic and can be removed by a strong base such as butyllithium (BuLi) to generate the neutral ylide. For example:"}, {"type": "figure", "caption": "", "image_url": "https://openstax.org/apps/image-cdn/v1/f=webp/apps/archive/20260604.144757/resources/4ea2f2d49e6e420825ceaa74fa652259d5aef3d2", "alt": "Triphenylphosphine reacts with bromomethane via an S N 2 reaction to produce methyltriphenylphosphonium bromide, which then reacts with B u L i and T H F to form methylenetriphenylphosphorane."}, {"type": "paragraph", "text": "The Wittig reaction is extremely general, and a great many monosubstituted, disubstituted, and trisubstituted alkenes can be prepared from the appropriate combination of phosphorane and aldehyde or ketone. Tetrasubstituted alkenes, however, can’t be prepared this way because of steric hindrance."}, {"type": "paragraph", "text": "The real value of the Wittig reaction is that it yields a pure alkene of predictable structure. The C═C C═C bond in the product is always exactly where the C═O C═O group was in the reactant, and no alkene isomers (except E , Z isomers) are formed. For example, Wittig reaction of cyclohexanone with methylenetriphenylphosphorane yields only the single alkene product methylenecyclohexane. By contrast, addition of methylmagnesium bromide to cyclohexanone, followed by dehydration with POCl 3 , yields a roughly 9 : 1 mixture of two alkenes."}, {"type": "figure", "caption": "", "image_url": "https://openstax.org/apps/image-cdn/v1/f=webp/apps/archive/20260604.144757/resources/fc2a4c30db5ee715a631a0f0d0b9ecbd2eb10f26", "alt": "Cyclohexanone reacts with methylmagnesium bromide, then phosphoryl trichloride, forming1-methylcyclohexene and methylenecyclohexane in 9: 1 ratio. It also reacts with methylenenetriphenylphosphorane and tetrahydrofuran to form methylenecyclohexane and Ph 3 P O."}, {"type": "paragraph", "text": "Wittig reactions are used commercially in the synthesis of numerous pharmaceutical products. For example, the German chemical company BASF prepares vitamin A by using a Wittig reaction between a 15-carbon ylide and a 5-carbon aldehyde."}, {"type": "figure", "caption": "", "image_url": "https://openstax.org/apps/image-cdn/v1/f=webp/apps/archive/20260604.144757/resources/9ee34dda75791fee22141b29403c19096db14a87", "alt": "A reaction where fifteen-carbon ylide, carbon-carbon aldehyde react in the presence of methanol, and sodium methoxide form vitamin A acetate."}, {"type": "paragraph", "text": "Worked Example 19.3 Synthesizing an Alkene Using a Wittig Reaction What carbonyl compound and what phosphorus ylide might you use to prepare 3-ethyl-2-pentene? Strategy An aldehyde or ketone reacts with a phosphorus ylide to yield an alkene in which the oxygen atom of the carbonyl reactant is replaced by the ═CR 2 of the ylide. Preparation of the phosphorus ylide itself usually involves S N 2 reaction of a primary alkyl halide with triphenylphosphine, so the ylide is typically primary, RCH═ P(Ph) 3 RCH═ P(Ph) 3 . This means that the disubstituted alkene carbon in the product comes from the carbonyl reactant, while the monosubstituted alkene carbon comes from the ylide. Solution"}, {"type": "paragraph", "text": "Problem 19-16 What carbonyl compound and what phosphorus ylide might you use to prepare each of the following compounds? (a) (b) (c) (d) (e) (f) Problem 19-17 β -Carotene, a yellow food-coloring agent and dietary source of vitamin A can be prepared by a double Wittig reaction between 2 equivalents of β -ionylideneacetaldehyde and a diylide. Show the structure of the β -carotene product."}], "keywords": ["wittig", "carbonyl", "alkene", "phosphorus", "ylide", "synthesis"], "lesson_ids": ["organic_synthesis"], "matched_terms": ["curated_lesson_mapping"]}], "video_evidence": [{"source_id": "gate_organic_pilot_organic_synthesis_retrosynthesis", "title": "Retrosynthesis Organic Chemistry MSc Chemistry | Disconnection Approach | Reductive Amination | Umpolung", "citation_label": "J Chemistry Team retrosynthesis video via VideoDB", "source_url": "https://www.youtube.com/watch?v=2I5vmNkYTOk", "video_id": "m-z-019f9df7-8edd-79a1-869d-a5ceb34bcea6", "collection_id": "c-fae8a4fb-d45d-4489-9993-16b861216501", "timestamp_start": 90.03, "timestamp_end": 180.12, "timestamp_label": "01:30-03:00", "transcript_preview": "ऑर्गेनिक अभी तक पढ़ी है वो सब सब चीजें हम यहाँ पर यूज करेंगे। मोस्टली जितने भी रिएक्शंस है ठीक है इसमें कवरअप हो जायेंगे। तो ये बहुत बड़ा कारण है जिसके लिए आपको रेट्रो सिंथेसिस पढ़ना चाहिए और 1 पर्सनल कारण भी है कि रेट्रोसिंटसिस पढके आपको मजा भी आएगा ठीक है। इट इज वेरी इंटरेस्टिंग टॉपिक सो, वो चीजें तो प्रोसीड करने से पहले आपको बताता हूं फिर कुछ टर्म्स आपको पता नी चाहिए थी। सबसे पहले तो आपको रेट्रो सिंटसाइजटदेखोरेडरो का मतलब क्या है? यू गो बैक आ पीछे जाते हो, पीछे जाने का मतलब है फॉर एग्जांपल, अगर आपके पास स्टार्टिंग मटीरियल है आपको सिंथेसाइज करते हो उसको जो आपने सिंथेसाइज किया उसको बोलते हो टार्गेट मालिकूल तो वो तो फॉरवर्ड सिंथेसिस है। ठीक है बट उस फॉरवर्ड सिंथेसिस को प्लान करने के लिए देखो आपको बताए आपको ये चीज बनानी है, आपको कोई टारगेट मॉलिक्यूल बनाना है उस टारगेट मॉलिक्यूल को बनाने के लिए आपको कौन कौन से रॉ मैटीरियल्स चाहिए होंगे जो रेड लि अवेलेबल भी है कमर्शली ठीक है और रूट्स क्या क्या होंगी राइट? तो उसको प्लान करने के लिए रेट्रो सं 10 इस इम्पॉर्टेंट है यह आपको क्या देगा बेसिकली बैकवर्ड में आपको समझ आएगी कि आप क्या क्या चीजें ले सकते हो जिसे आप ये टारगेट मालिकुल बना सकते हो। यूजिंग यौर ऑर्गेनिक केमिस्ट्री नॉलेज, ठीक है। तो इसी के साथ अभी हम स्टार्ट करते हैं, ठीक है। तो मैं कुछ टर्म्स बोल रहा था वो मैं एग्जाम्पल के थ्रू आपको
