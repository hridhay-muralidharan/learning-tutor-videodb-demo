": "Source-backed", "message": "This lesson has processed source evidence."}, "textbook": {"state": "source_backed", "label": "Source-backed", "message": "This lesson has processed source evidence."}, "video": {"state": "source_backed", "label": "Source-backed", "message": "This lesson has processed source evidence."}, "questions": {"state": "source_backed", "label": "Source-backed", "message": "This lesson has processed source evidence."}}, "source_integrity_state": "source_backed", "evidence_completeness_score": 1.0, "missing_messages": []}, "mastery_state": "not_started"}, {"id": "pericyclic_photochemistry", "order": 4, "title": "Pericyclic and Photochemical Logic", "module": "Pericyclic Reactions and Photochemistry", "syllabus_anchor": "Electrocyclic, cycloaddition and sigmatropic reactions; FMO and PMO treatments; Woodward-Hoffmann rule; photochemistry of alkenes, arenes and carbonyl compounds; photooxidation, photoreduction, di-pi-methane rearrangement, Barton-McCombie reaction, and Norrish type-I and II cleavage.", "concept_thread": {"id": "pericyclic_selection_rules", "label": "Pericyclic selection rules and electrocyclic motion", "source_coverage": {"textbook": 2, "video": 1, "questions": 1}, "missing_source_types": [], "alignment_state": "source_backed", "alignment_score": 38.5, "evidence_ids": {"syllabus": ["pericyclic_photochemistry:syllabus"], "textbook": ["openstax_orgchem_pericyclic_30_intro", "openstax_orgchem_photochemistry_30_8"], "video": ["gate_organic_expansion_pericyclic_photochemistry_jchem:1530.18-1620.07"], "questions": ["official_gate_cy_2025_0033"]}}, "source_grounded_summary": "Study this lesson as orbital-symmetry and excited-state evidence. Do not reduce it to name recall; require orbital or photochemical rationale from sources.", "textbook_evidence": [{"source_id": "openstax_organic_chemistry", "citation_label": "OpenStax Organic Chemistry, John McMurry, 10th edition, 30.9 A Summary of Rules for Pericyclic Reactions", "source_url": "https://openstax.org/books/organic-chemistry/pages/30-9-a-summary-of-rules-for-pericyclic-reactions", "license": "CC BY-NC-SA 4.0", "section_title": "30.9 A Summary of Rules for Pericyclic Reactions", "page": null, "chunk_id": "openstax_orgchem_pericyclic_30_intro", "text_preview": "Pericyclic reactions occur through concerted cyclic transition states. The OpenStax treatment connects electrocyclic, cycloaddition, and sigmatropic outcomes to orbital symmetry.", "full_text": "How can you keep straight all the rules about pericyclic reactions? The summary in Table 30.1 , Table 30.2 , and Table 30.3 can be distilled into a mnemonic phrase that provides an easy way to predict the stereochemical outcome of any pericyclic reaction:\n\nThe Electrons Circle Around ( TECA )\n\nT hermal reactions with an E ven number of electron pairs are C onrotatory or A ntarafacial.\n\nA change either from thermal to photochemical or from an even to an odd number of electron pairs changes the outcome from conrotatory/antarafacial to disrotatory/suprafacial. A change from both thermal and even to photochemical and odd causes no change because two negatives make a positive.\n\nThese selection rules are summarized in Table 30.4 ; knowing them gives you the ability to predict the stereochemistry of literally thousands of pericyclic reactions.\n\nTable 30.4 Stereochemical Rules for Pericyclic Reactions Electronic state Electron pairs Stereochemistry Ground state (thermal) Even number Odd number Antara-con Supra-dis Excited state (photochemical) Even number Odd number Supra-dis Antara-con\n\nProblem 30-12 Predict the stereochemistry of the following pericyclic reactions: (a) The thermal cyclization of a conjugated tetraene (b) The photochemical cyclization of a conjugated tetraene (c) A photochemical [4 + 4] cycloaddition (d) A thermal [2 + 6] cycloaddition (e) A photochemical [3,5] sigmatropic rearrangement", "content_blocks": [{"type": "paragraph", "text": "How can you keep straight all the rules about pericyclic reactions? The summary in Table 30.1 , Table 30.2 , and Table 30.3 can be distilled into a mnemonic phrase that provides an easy way to predict the stereochemical outcome of any pericyclic reaction:"}, {"type": "paragraph", "text": "The Electrons Circle Around ( TECA )"}, {"type": "paragraph", "text": "T hermal reactions with an E ven number of electron pairs are C onrotatory or A ntarafacial."}, {"type": "paragraph", "text": "A change either from thermal to photochemical or from an even to an odd number of electron pairs changes the outcome from conrotatory/antarafacial to disrotatory/suprafacial. A change from both thermal and even to photochemical and odd causes no change because two negatives make a positive."}, {"type": "paragraph", "text": "These selection rules are summarized in Table 30.4 ; knowing them gives you the ability to predict the stereochemistry of literally thousands of pericyclic reactions."}, {"type": "paragraph", "text": "Table 30.4 Stereochemical Rules for Pericyclic Reactions Electronic state Electron pairs Stereochemistry Ground state (thermal) Even number Odd number Antara-con Supra-dis Excited state (photochemical) Even number Odd number Supra-dis Antara-con"}, {"type": "paragraph", "text": "Problem 30-12 Predict the stereochemistry of the following pericyclic reactions: (a) The thermal cyclization of a conjugated tetraene (b) The photochemical cyclization of a conjugated tetraene (c) A photochemical [4 + 4] cycloaddition (d) A thermal [2 + 6] cycloaddition (e) A photochemical [3,5] sigmatropic rearrangement"}], "keywords": ["pericyclic", "thermal", "photochemical", "conrotatory", "disrotatory", "suprafacial", "antarafacial", "selection", "rules"], "lesson_ids": ["pericyclic_photochemistry"], "matched_terms": ["curated_lesson_mapping"]}, {"source_id": "openstax_organic_chemistry", "citation_label": "OpenStax Organic Chemistry, John McMurry, 10th edition, 30.4 Photochemical Electrocyclic Reactions", "source_url": "https://openstax.org/books/organic-chemistry/pages/30-4-photochemical-electrocyclic-reactions", "license": "CC BY-NC-SA 4.0", "section_title": "30.4 Photochemical Electrocyclic Reactions", "page": null, "chunk_id": "openstax_orgchem_photochemistry_30_8", "text_preview": "Photochemical electrocyclic reactions reverse the orbital-occupancy logic of thermal reactions. The section supports comparing ground-state and excited-state reaction pathways.", "full_text": "We noted previously that photochemical electrocyclic reactions take a different stereochemical course than their thermal counterparts, and we can now explain this difference. Ultraviolet irradiation of a polyene causes an excitation of one electron from the ground-state HOMO to the ground-state LUMO, thus changing their symmetries. But because electronic excitation changes the symmetries of HOMO and LUMO, it also changes the reaction stereochemistry. (2 E ,4 E )-2,4-Hexadiene, for instance, undergoes photochemical cyclization by a disrotatory path, whereas the thermal reaction is conrotatory. Similarly, (2 E ,4 Z ,6 E )-2,4,6-octatriene undergoes photochemical cyclization by a conrotatory path, whereas the thermal reaction is disrotatory ( Figure 30.8 ).\n\nFigure 30.8 Photochemical cyclizations of conjugated dienes and trienes. The two processes occur with different stereochemistry because of their different orbital symmetries.\n\nThermal and photochemical electrocyclic reactions always take place with opposite stereochemistry because the symmetries of the frontier orbitals are always different. Table 30.1 gives some simple rules that make it possible to predict the stereochemistry of electrocyclic reactions.\n\nTable 30.1 Stereochemical Rules for Electrocyclic Reactions Electron pairs (double bonds) Thermal reaction Photochemical reaction Even number Conrotatory Disrotatory Odd number Disrotatory Conrotatory\n\nProblem 30-4 What product would you expect to obtain from the photochemical cyclization of (2 E ,4 Z ,6 E )-2,4,6-octatriene? Of (2 E ,4 Z ,6 Z )-2,4,6-octatriene?", "content_blocks": [{"type": "paragraph", "text": "We noted previously that photochemical electrocyclic reactions take a different stereochemical course than their thermal counterparts, and we can now explain this difference. Ultraviolet irradiation of a polyene causes an excitation of one electron from the ground-state HOMO to the ground-state LUMO, thus changing their symmetries. But because electronic excitation changes the symmetries of HOMO and LUMO, it also changes the reaction stereochemistry. (2 E ,4 E )-2,4-Hexadiene, for instance, undergoes photochemical cyclization by a disrotatory path, whereas the thermal reaction is conrotatory. Similarly, (2 E ,4 Z ,6 E )-2,4,6-octatriene undergoes photochemical cyclization by a conrotatory path, whereas the thermal reaction is disrotatory ( Figure 30.8 )."}, {"type": "figure", "caption": "Figure 30.8 Photochemical cyclizations of conjugated dienes and trienes. The two processes occur with different stereochemistry because of their different orbital symmetries.", "image_url": "https://openstax.org/apps/image-cdn/v1/f=webp/apps/archive/20260604.144757/resources/a6b4df9b6e3c412f7f320e3ee4d4adce7f5a846b", "alt": "Conjugated dienes and trienes undergoing photochemical cyclization. (2E,4E)-2,4-hexadiene reacts with light through disrotation to form cis-3,4-dimethylcyclobutene. (2E,4Z,6E)-2,4,6-octatriene reacts with light through conrotation to form trans-5,6-dimethyl-1,3-cyclohexadiene."}, {"type": "paragraph", "text": "Thermal and photochemical electrocyclic reactions always take place with opposite stereochemistry because the symmetries of the frontier orbitals are always different. Table 30.1 gives some simple rules that make it possible to predict the stereochemistry of electrocyclic reactions."}, {"type": "paragraph", "text": "Table 30.1 Stereochemical Rules for Electrocyclic Reactions Electron pairs (double bonds) Thermal reaction Photochemical reaction Even number Conrotatory Disrotatory Odd number Disrotatory Conrotatory"}, {"type": "paragraph", "text": "Problem 30-4 What product would you expect to obtain from the photochemical cyclization of (2 E ,4 Z ,6 E )-2,4,6-octatriene? Of (2 E ,4 Z ,6 Z )-2,4,6-octatriene?"}], "keywords": ["photochemical", "electrocyclic", "pericyclic", "conrotatory", "disrotatory", "frontier", "orbitals"], "lesson_ids": ["pericyclic_photochemistry"], "matched_terms": ["curated_lesson_mapping"]}], "video_evidence": [{"source_id": "gate_organic_expansion_pericyclic_photochemistry_jchem", "title": "Pericyclic Reactions | Photochemistry | GATE Chemistry Crash Course | IIT JAM Crash Course Chemistry", "citation_label": "J Chemistry Team pericyclic and photochemistry crash course via VideoDB", "source_url": "https://www.youtube.com/watch?v=vCUhjaAPc20", "video_id": "m-z-019f9e12-1767-77b0-83b1-76e80dae1106", "collection_id": "c-fae8a4fb-d45d-4489-9993-16b861216501", "timestamp_start": 1530.18, "timestamp_end": 1620.07, "timestamp_label": "25:30-27:00", "transcript_preview": "पा इलेक्ट्रॉन वॉलेस में देखो यहाँ पे एनआईएन है तुझ ये दुबारा से क्लोजिंग करेगा तो क्लोजिंग में देखो आप देख सकते हो 22 नाइन के पाल इलेक्ट्रॉन हो गए और 2 इस डबल वान के हो गए तो टोटल कितने बार लेक्ट्रॉनसइनवाल्ड है फोर पाई इलेक्ट्रॉन इन बोल्ड सो फोरएनपायलेक्ट्रॉन सिस्टम है अंडर थर्मल कंडीशंस हम करा रहे हैं तो आपको क्या मिलेगा कॉनोटेशन मिलेगी ठीक है आपको क्या मिलेगा कौन रोटेशन मिलेगी अब यहाँ से आप यहाँ जा रहे हो है अब आपने देखना है कि इन 2 कीस्तीरोकमिस्ट्री कैसे रहे देखो अगर मैं यहाँ पर मैंने क्या दिखाया दोनों आउटवर्ड दिखाया है सिमिलर ली मैं दोनों इनवर्ट भी दिखा सकता हूँ तो दोनों आउटवर्ड रहेंगे दोनों इनवर्ड रहेंगे अंडर कॉनटेन क्या चले जायेंगे 1 दूसरे के ट्रांस से ले जाएंगे तो यहाँ पर क्या है दोनों यहाँ पर 1 दूसरे के सिस है तो वहाँ पर स्टीरियो क्या होगी क्योंकि आपको पता यहाँ पे फुरेन पाय इलेक्ट्रॉन सिस्टम है मींस के वहाँ पर कॉनोटेशन है तो कॉन्डेटेशन के बाद तो इनको तो ट्रांस आना चाहिए था न बिकाज हमने बात करी बोतारआउटवर्ड तो बोथार आउटवर्ड मींज के अगर हम कॉन्डिडेशन करेंगे तो दोनों ट्रांस आ जाने चाहिए पर रिंग क्लोजिग देख रहा हूँ रंग क्लोजिंग में वो आपस में क्या जा रहे हैं से जा रहे हैं सो पर डस दैट मीन के ये आउटवर्ड इनवर्ड है क्या है बहुत आउटवर्ड है बहुत इनवर्ड नहीं है आउटवर्ड इनवर्ड है तो वहा", "evidence_mode": "videodb_spoken_word_search"}], "question_evidence": [{"question_id": "official_gate_cy_2025_0033", "citation_label": "Official GATE 2025 Chemistry question paper", "year": 2025, "source_url": "https://gate2026.iitg.ac.in/doc/download/2025/CY2025.pdf", "source_path": "resources/question_banks/official_gate/gate_cy_2025_question_paper.pdf", "page": 22, "prompt_preview": "Q.27 Choose the correct option(s) with regard to mechanism of the following transformation. (A) It proceeds through divinyl cyclopropane rearrangement (B) It involves a diradical intermediate (C) It proceeds through di--methane rearrangement (D) It proceeds through [2+2+2] cycloaddition reaction", "keywords": ["choose", "correct", "options", "regard", "mechanism", "following", "transformation", "proceeds", "through", "divinyl", "cyclopropane", "rearrangement", "involves", "diradical", "intermediate", "methane", "cycloaddition", "reaction"], "matched_terms": ["cycloaddition", "divinyl cyclopropane", "rearrangement"]}], "review_prompts": ["Can you identify the reaction class before applying a rule?", "Can you connect the allowed pathway to orbital symmetry or excited-state behavior?"], "readiness": {"state": "ready", "completeness": {"syllabus": true, "textbook": true, "video": true, "questions": true}, "source_states": {"syllabus": {"state": "source_backed", "label": "Source-backed", "message": "This lesson has processed source evidence."}, "textbook": {"state": "source_backed", "label": "Source-backed", "message": "This lesson has processed source evidence."}, "video": {"state": "source_backed", "label": "Source-backed", "message": "This lesson has processed source evidence."}, "questions": {"state": "source_backed", "label": "Source-backed", "message": "This lesson has processed source evidence."}}, "source_integrity_state": "source_backed", "evidence_completeness_score": 1.0, "missing_messages": []}, "mastery_state": "not_started"}, {"id": "heterocycles", "order": 5, "title": "Heterocycle Structure and Reactions", "module": "Heterocyclic Compounds", "syllabus_anchor": "Structure, preparation, properties and reactions of furan, pyrrole, thiophene, pyridine, indole, quinoline and isoquinoline.", "concept_thread": {"id": "aromatic_heterocycles", "label": "Aromatic heterocycles and heteroatom effects", "source_coverage": {"textbook": 1, "video": 4, "questions": 1}, "missing_source_types": [], "alignment_state": "source_backed", "alignment_score": 40.0, "evidence_ids": {"syllabus": ["heterocycles:syllabus"], "textbook": ["openstax_orgchem_heterocycles_15_5"], "video": ["gate_organic_expansion_heterocycles_sp_structure_reactions:630.04-720.06", "gate_organic_expansion_heterocycles_sp_structure_reactions:2160.03-2250.08", "gate_organic_expansion_heterocycles_sp_structure_reactions:900.39-990.16", "gate_organic_expansion_heterocycles_sp_structure_reactions:1890.09-1980.12"], "questions": ["official_gate_cy_2024_0029"]}}, "source_grounded_summary": "Study this lesson as structure-reactivity comparison across named heterocycles. Claims should cite the source treatment of aromaticity, heteroatom effect, and reaction position.", "textbook_evidence": [{"source_id": "openstax_organic_chemistry", "citation_label": "OpenStax Organic Chemistry, John McMurry, 10th edition, 15.5 Aromatic Heterocycles: Pyridine and Pyrrole", "source_url": "https://openstax.org/books/organic-chemistry/pages/15-5-aromatic-heterocycles-pyridine-and-pyrrole", "license": "CC BY-NC-SA 4.0", "section_title": "15.5 Aromatic Heterocycles: Pyridine and Pyrrole", "page": null, "chunk_id": "openstax_orgchem_heterocycles_15_5", "text_preview": "Pyridine and pyrrole are aromatic heterocycles with different lone-pair roles. The section gives the structure-reactivity contrast needed for heterocycle comparison.", "full_text": "Look back once again at the definition of aromaticity in Section 15.3 : a cyclic, conjugated molecule containing 4 n + 2 π electrons. Nothing in this definition says that the atoms in the ring must be carbon. In fact, heterocyclic compounds can also be aromatic. A heterocycle is a cyclic compound that contains atoms of more than one element in its ring, usually carbon along with nitrogen, oxygen, or sulfur. Pyridine and pyrimidine, for example, are six-membered heterocycles with carbon and nitrogen in their rings ( Figure 15.9 ).\n\nFigure 15.9 Pyridine and pyrimidine are nitrogen-containing aromatic heterocycles with π electron arrangements like that of benzene. Both have a lone pair of electrons on nitrogen in an sp 2 orbital in the plane of the ring.\n\nPyridine is much like benzene in its π electron structure. Each of the five sp 2 -hybridized carbons has a p orbital perpendicular to the plane of the ring, and each p orbital contains one π electron. The nitrogen atom is also sp 2 -hybridized and has one electron in a p orbital, bringing the total to six π electrons. The nitrogen lone-pair electrons (red in an electrostatic potential map) are in a sp 2 orbital in the plane of the ring and are not part of the aromatic π system. Pyrimidine, also shown in Figure 15.9 , is a benzene analog that has two nitrogen atoms in a six-membered, unsaturated ring. Both nitrogens are sp 2 -hybridized, and each contributes one electron to the aromatic π system.\n\nPyrrole (spelled with two r ’s and one l ) and imidazole are five -membered heterocycles, yet both have six π electrons and are aromatic. In pyrrole, each of the four sp 2 -hybridized carbons contributes one π electron and the sp 2 -hybridized nitrogen atom contributes the two from its lone pair, which occupies a p orbital ( Figure 15.10 ). Imidazole, also shown in Figure 15.10 , is an analog of pyrrole that has two nitrogen atoms in a five-membered, unsaturated ring. Both nitrogens are sp 2 -hybridized, but one is in a double bond and contributes only one electron to the aromatic π system whereas the other is not in a double bond and contributes two from its lone pair.\n\nFigure 15.10 Pyrrole and imidazole are five-membered, nitrogen-containing heterocycles but have six- π -electron arrangements like that of the cyclopentadienyl anion. Both have a lone pair of electrons on nitrogen in a p orbital perpendicular to the ring.\n\nNote that nitrogen atoms have different roles depending on the structure of the molecule. The nitrogen atoms in pyridine and pyrimidine are both in double bonds and contribute only one π electron to the aromatic sextet, just as a carbon atom in benzene does. The nitrogen atom in pyrrole, however, is not in a double bond and contributes two π electrons (its lone pair) to the aromatic sextet. In imidazole, both kinds of nitrogen are present in the same molecule-a double-bonded “pyridine-like” nitrogen that contributes one π electron and a “pyrrole-like” nitrogen that contributes two.\n\nPyrimidine and imidazole rings are particularly important in biological chemistry. Pyrimidine, for instance, is the parent ring system in cytosine, thymine, and uracil, three of the five heterocyclic amine bases found in nucleic acids. An aromatic imidazole ring is present in histidine, one of the 20 amino acids found in proteins.\n\nWorked Example 15.1 Accounting for the Aromaticity of a Heterocycle Thiophene, a sulfur-containing heterocycle, undergoes typical aromatic substitution reactions rather than addition reactions. Why is thiophene aromatic? Strategy Recall the requirements for aromaticity-a planar, cyclic, conjugated molecule with 4 n + 2 π electrons-and see how these requirements apply to thiophene. Solution Thiophene is the sulfur analog of pyrrole. The sulfur atom is sp 2 -hybridized and has a lone pair of electrons in a p orbital perpendicular to the plane of the ring. Sulfur also has a second lone pair of electrons in the ring plane.\n\nProblem 15-9 Draw an orbital picture of furan to show how the molecule is aromatic. Problem 15-10 Thiamin, or vitamin B 1 , contains a positively charged five-membered nitrogen-sulfur heterocycle called a thiazolium ring. Explain why the thiazolium ring is aromatic.", "content_blocks": [{"type": "paragraph", "text": "Look back once again at the definition of aromaticity in Section 15.3 : a cyclic, conjugated molecule containing 4 n + 2 π electrons. Nothing in this definition says that the atoms in the ring must be carbon. In fact, heterocyclic compounds can also be aromatic. A heterocycle is a cyclic compound that contains atoms of more than one element in its ring, usually carbon along with nitrogen, oxygen, or sulfur. Pyridine and pyrimidine, for example, are six-membered heterocycles with carbon and nitrogen in their rings ( Figure 15.9 )."}, {"type": "figure", "caption": "Figure 15.9 Pyridine and pyrimidine are nitrogen-containing aromatic heterocycles with π electron arrangements like that of benzene. Both have a lone pair of electrons on nitrogen in an sp 2 orbital in the plane of the ring.", "image_url": "https://openstax.org/apps/image-cdn/v1/f=webp/apps/archive/20260604.144757/resources/d74473162ee2f9b4ed49ad74bcbc80758babd7ad", "alt": "Structures, orbital representations, and ball-and-stick model along with electrostatic potential maps of pyridine and pyrimidine. The lone pair in s p 2 orbital is labeled in both structures."}, {"type": "paragraph", "text": "Pyridine is much like benzene in its π electron structure. Each of the five sp 2 -hybridized carbons has a p orbital perpendicular to the plane of the ring, and each p orbital contains one π electron. The nitrogen atom is also sp 2 -hybridized and has one electron in a p orbital, bringing the total to six π electrons. The nitrogen lone-pair electrons (red in an electrostatic potential map) are in a sp 2 orbital in the plane of the ring and are not part of the aromatic π system. Pyrimidine, also shown in Figure 15.9 , is a benzene analog that has two nitrogen atoms in a six-membered, unsaturated ring. Both nitrogens are sp 2 -hybridized, and each contributes one electron to the aromatic π system."}, {"type": "paragraph", "text": "Pyrrole (spelled with two r ’s and one l ) and imidazole are five -membered heterocycles, yet both have six π electrons and are aromatic. In pyrrole, each of the four sp 2 -hybridized carbons contributes one π electron and the sp 2 -hybridized nitrogen atom contributes the two from its lone pair, which occupies a p orbital ( Figure 15.10 ). Imidazole, also shown in Figure 15.10 , is an analog of pyrrole that has two nitrogen atoms in a five-membered, unsaturated ring. Both nitrogens are sp 2 -hybridized, but one is in a double bond and contributes only one electron to the aromatic π system whereas the other is not in a double bond and contributes two from its lone pair."}, {"type": "figure", "caption": "Figure 15.10 Pyrrole and imidazole are five-membered, nitrogen-containing heterocycles but have six- π -electron arrangements like that of the cyclopentadienyl anion. Both have a lone pair of electrons on nitrogen in a p orbital perpendicular to the ring.", "image_url": "https://openstax.org/apps/image-cdn/v1/f=webp/apps/archive/20260604.144757/resources/3cc81c513bd6ba229c9b922528fd64811d973d6f", "alt": "Structures, orbital representations, and ball-and-stick model along with electrostatic potential maps of pyrrole and imidazole. The lone pair in p and s p 2 orbital is labeled in both structures."}, {"type": "paragraph", "text": "Note that nitrogen atoms have different roles depending on the structure of the molecule. The nitrogen atoms in pyridine and pyrimidine are both in double bonds and contribute only one π electron to the aromatic sextet, just as a carbon atom in benzene does. The nitrogen atom in pyrrole, however, is not in a double bond and contributes two π electrons (its lone pair) to the aromatic sextet. In imidazole, both kinds of nitrogen are present in the same molecule-a double-bonded “pyridine-like” nitrogen that contributes one π electron and a “pyrrole-like” nitrogen that contributes two."}, {"type": "paragraph", "text": "Pyrimidine and imidazole rings are particularly important in biological chemistry. Pyrimidine, for instance, is the parent ring system in cytosine, thymine, and uracil, three of the five heterocyclic amine bases found in nucleic acids. An aromatic imidazole ring is present in histidine, one of the 20 amino acids found in proteins."}, {"type": "figure", "caption": "", "image_url": "https://openstax.org/apps/image-cdn/v1/f=webp/apps/archive/20260604.144757/resources/82df9386fce5cdf89c049d15edb2e537c083cf8f", "alt": "The structures of cytosine (in D N A and R N A), thymine (in D N A), uracil (in R N A), and histidine (an amino acid)."}, {"type": "paragraph", "text": "Worked Example 15.1 Accounting for the Aromaticity of a Heterocycle Thiophene, a sulfur-containing heterocycle, undergoes typical aromatic substitution reactions rather than addition reactions. Why is thiophene aromatic? Strategy Recall the requirements for aromaticity-a planar, cyclic, conjugated molecule with 4 n + 2 π electrons-and see how these requirements apply to thiophene. Solution Thiophene is the sulfur analog of pyrrole. The sulfur atom is sp 2 -hybridized and has a lone pair of electrons in a p orbital perpendicular to the plane of the ring. Sulfur also has a second lone pair of electrons in the ring plane."}, {"type": "paragraph", "text": "Problem 15-9 Draw an orbital picture of furan to show how the molecule is aromatic. Problem 15-10 Thiamin, or vitamin B 1 , contains a positively charged five-membered nitrogen-sulfur heterocycle called a thiazolium ring. Explain why the thiazolium ring is aromatic."}], "keywords": ["heterocycles", "pyridine", "pyrrole", "aromatic", "lone", "reactivity"], "lesson_ids": ["heterocycles"], "  "question_evidence": [{"question_id": "official_gate_cy_2024_0029", "citation_label": "Official GATE 2024 Chemistry question paper", "year": 2024, "source_url": "https://gate2026.iitg.ac.in/doc/download/2024/CY24S1.pdf", "source_path": "resources/question_banks/official_gate/gate_cy_2024_question_paper.pdf", "page": 19, "prompt_preview": "Q.25 The reaction(s) that yield(s) 2-methylquinoline as the major product is (are) (A) (B) (C) (D)", "keywords": ["reactions", "yields", "methylquinoline", "major", "product"], "matched_terms": ["quinoline", "2-methylquinoline"]}], "review_prompts": ["Can you compare two heterocycles by electron distribution and position of attack?", "Can you explain the preparation or reaction pattern with a source-backed structure argument?"], "readiness": {"state": "ready", "completeness": {"syllabus": true, "textbook": true, "video": true, "questions": true}, "source_states": {"syllabus": {"state": "source_backed", "label": "Source-backed", "message": "This lesson has processed source evidence."}, "textbook": {"state": "source_backed", "label": "Source-backed", "message": "This lesson has processed source evidence."}, "video": {"state": "source_backed", "label": "Source-backed", "message": "This lesson has processed source evidence."}, "questions": {"state": "source_backed", "label": "Source-backed", "message": "This lesson has processed source evidence."}}, "source_integrity_state": "source_backed", "evidence_completeness_score": 1.0, "missing_messages": []}, "mastery_state": "not_started"}, {"id": "biomolecules", "order": 6, "title": "Biomolecules in Organic Chemistry", "module": "Biomolecules", "syllabus_anchor": "Structure, properties and reactions of mono- and di-saccharides; physicochemical properties of amino acids; peptide synthesis and structure determination; structural features of proteins, nucleic acids, lipids, steroids, terpenoids, carotenoids and alkaloids.", "concept_thread": {"id": "carbohydrates_amino_acids_peptides", "label": "Carbohydrates, amino acids, and peptides", "source_coverage": {"textbook": 3, "video": 4, "questions": 2}, "missing_source_types": [], "alignment_state": "source_backed", "alignment_score": 44.0, "evidence_ids": {"syllabus": ["biomolecules:syllabus"], "textbook": ["openstax_orgchem_biomolecules_25_1", "openstax_orgchem_biomolecules_26_1", "openstax_orgchem_biomolecules_28_1"], "video": ["gate_organic_expansion_biomolecules_short_apna_sapna:2070.01-2160.03", "gate_organic_expansion_biomolecules_short_apna_sapna:1170.03-1260.03", "gate_organic_expansion_biomolecules_short_apna_sapna:360.18-450.05", "gate_organic_expansion_biomolecules_short_apna_sapna:630.09-720.09"], "questions": ["official_gate_cy_2025_0038", "official_gate_cy_2024_0027"]}}, "source_grounded_summary": "Study this lesson as organic structure and functional-group reasoning applied to biological molecule classes.", "textbook_evidence": [{"source_id": "openstax_organic_chemistry", "citation_label": "OpenStax Organic Chemistry, John McMurry, 10th edition, 25.1 Classification of Carbohydrates", "source_url": "https://openstax.org/books/organic-chemistry/pages/25-1-classification-of-carbohydrates", "license": "CC BY-NC-SA 4.0", "section_title": "25.1 Classification of Carbohydrates", "page": null, "chunk_id": "openstax_orgchem_biomolecules_25_1", "text_preview": "Carbohydrates are classified by carbonyl type and carbon count, with monosaccharides, disaccharides, and polysaccharides treated as structure-defined organic molecule classes.", "full_text": "Carbohydrates are generally classified as either simple or complex. Simple sugars , or monosaccharides , are carbohydrates like glucose and fructose that can’t be converted into smaller sugars by hydrolysis. Complex carbohydrates are made of two or more simple sugars linked together by acetal bonds ( Section 19.10 ). Sucrose (table sugar), for instance, consists of one glucose linked to one fructose. Similarly, cellulose is made up of several thousand glucose units linked together. Enzyme-catalyzed hydrolysis of a complex carbohydrate breaks it down into its constituent monosaccharides.\n\nMonosaccharides are further classified as either aldoses or ketoses . The - ose suffix designates a carbohydrate, and the prefixes aldo - and keto - identify the kind of carbonyl group in the molecule, whether aldehyde or ketone. The number of carbon atoms in the monosaccharide is indicated by the appropriate numerical prefix tri -, tetr -, pent -, hex -, and so forth, in the name. Putting it all together, glucose is an aldohexose, a six-carbon aldehyde sugar; fructose is a ketohexose, a six-carbon keto sugar; ribose is an aldopentose, a five-carbon aldehyde sugar; and sedoheptulose is a ketoheptose, a seven-carbon keto sugar. Most of the common simple sugars are either pentoses or hexoses.\n\nProblem 25-1 Classify each of the following monosaccharides: (a) (b) (c) (d)", "content_blocks": [{"type": "paragraph", "text": "Carbohydrates are generally classified as either simple or complex. Simple sugars , or monosaccharides , are carbohydrates like glucose and fructose that can’t be converted into smaller sugars by hydrolysis. Complex carbohydrates are made of two or more simple sugars linked together by acetal bonds ( Section 19.10 ). Sucrose (table sugar), for instance, consists of one glucose linked to one fructose. Similarly, cellulose is made up of several thousand glucose units linked together. Enzyme-catalyzed hydrolysis of a complex carbohydrate breaks it down into its constituent monosaccharides."}, {"type": "figure", "caption": "", "image_url": "https://openstax.org/apps/image-cdn/v1/f=webp/apps/archive/20260604.144757/resources/bc16b550390c7f597296a8bbfb9106a24939faba", "alt": "Enzyme-catalyzed hydrolysis decomposes sucrose (a disaccharide) into glucose and fructose. Similarly, cellulose (a polysaccharide) decomposes into approximately three thousand glucose units."}, {"type": "paragraph", "text": "Monosaccharides are further classified as either aldoses or ketoses . The - ose suffix designates a carbohydrate, and the prefixes aldo - and keto - identify the kind of carbonyl group in the molecule, whether aldehyde or ketone. The number of carbon atoms in the monosaccharide is indicated by the appropriate numerical prefix tri -, tetr -, pent -, hex -, and so forth, in the name. Putting it all together, glucose is an aldohexose, a six-carbon aldehyde sugar; fructose is a ketohexose, a six-carbon keto sugar; ribose is an aldopentose, a five-carbon aldehyde sugar; and sedoheptulose is a ketoheptose, a seven-carbon keto sugar. Most of the common simple sugars are either pentoses or hexoses."}, {"type": "figure", "caption": "", "image_url": "https://openstax.org/apps/image-cdn/v1/f=webp/apps/archive/20260604.144757/resources/3b949eb2254720592ac8d95d43ad9423c9d58b50", "alt": "The structures of glucose (an aldohexose), fructose (a ketohexose), ribose (an aldopentose), and sedoheptulose (a ketoheptose), presented in Fischer projection."}, {"type": "paragraph", "text": "Problem 25-1 Classify each of the following monosaccharides: (a) (b) (c) (d)"}], "keywords": ["carbohydrates", "monosaccharides", "disaccharides", "polysaccharides", "carbonyl", "structure"], "lesson_ids": ["biomolecules"], "matched_terms": ["curated_lesson_mapping"]}, {"source_id": "openstax_organic_chemistry", "citation_label": "OpenStax Organic Chemistry, John McMurry, 10th edition, 26.1 Structures of Amino Acids", "source_url": "https://openstax.org/books/organic-chemistry/pages/26-1-structures-of-amino-acids", "license": "CC BY-NC-SA 4.0", "section_title": "26.1 Structures of Amino Acids", "page": null, "chunk_id": "openstax_orgchem_biomolecules_26_1", "text_preview": "Amino acids are described by shared amino and carboxyl groups plus variable side chains. This anchors peptide, protein, and physicochemical-property questions in organic structure.", "full_text": "We saw in Section 20.3 and Section 24.5 that a carboxyl group is deprotonated and exists as the carboxylate anion at a physiological pH of 7.3, while an amino group is protonated and exists as the ammonium cation. Thus, amino acids exist in aqueous solution primarily in the form of a dipolar ion, or zwitterion (from the German zwitter, meaning “hybrid”).\n\nAmino acid zwitterions are internal salts and therefore have many of the physical properties associated with salts. They have large dipole moments, are relatively soluble in water but insoluble in hydrocarbons, and are crystalline with relatively high melting points. In addition, amino acids are amphiprotic; they can react either as acids or as bases, depending on the circumstances. In aqueous acid solution, an amino acid zwitterion is a base that accepts a proton onto its -CO 2 - group to yield a cation. In aqueous base solution, the zwitterion is an acid that loses a proton from its -NH 3 + group to form an anion.\n\nThe structures, abbreviations (both three- and one-letter), and p K a values of the 20 amino acids commonly found in proteins are shown in Table 26.1 . All are α -amino acids , meaning that the amino group in each is a substituent on the α carbon-the one next to the carbonyl group. Nineteen of the twenty amino acids are primary amines, RNH 2 , and differ only in the nature of their side chain -the substituent attached to the α carbon. Proline is a secondary amine whose nitrogen and α carbon atoms are part of a five-membered pyrrolidine ring.\n\nTable 26.1 The 20 Common Amino Acids in Proteins Name Abbreviations MW Structure p K a α -CO 2 H p K a α -NH 3 + p K a side chain p I Neutral Amino Acids Alanine Ala A 89 2.34 9.69 - 6.01 Asparagine Asn N 132 2.02 8.80 - 5.41 Cysteine Cys C 121 1.96 10.28 8.18 5.07 Glutamine Gln Q 146 2.17 9.13 - 5.65 Glycine Gly G 75 2.34 9.60 - 5.97 Isoleucine Ile I 131 2.36 9.60 - 6.02 Leucine Leu L 131 2.36 9.60 - 5.98 Methionine Met M 149 2.28 9.21 - 5.74 Phenylalanine Phe F 165 1.83 9.13 - 5.48 Proline Pro P 115 1.99 10.60 - 6.30 Serine Ser S 105 2.21 9.15 - 5.68 Threonine Thr T 119 2.09 9.10 - 5.60 Tryptophan Trp W 204 2.83 9.39 - 5.89 Tyrosine Tyr Y 181 2.20 9.11 10.07 5.66 Valine Val V 117 2.32 9.62 - 5.96 Acidic Amino Acids Aspartic acid Asp D 133 1.88 9.60 3.65 2.77 Glutamic acid Glu E 147 2.19 9.67 4.25 3.22 Basic Amino Acids Arginine Arg R 174 2.17 9.04 12.48 10.76 Histidine His H 155 1.82 9.17 6.00 7.59 Lysine Lys K 146 2.18 8.95 10.53 9.74\n\nIn addition to the 20 amino acids commonly found in proteins, 2 others-selenocysteine and pyrrolysine-are found in some organisms, and more than 700 nonprotein amino acids are also found in nature. γ -Aminobutyric acid (GABA), for instance, is found in the brain and acts as a neurotransmitter; homocysteine is found in blood and is linked to coronary heart disease; and thyroxine is found in the thyroid gland, where it acts as a hormone.\n\nExcept for glycine, H 2 NCH 2 CO 2 H, the α carbons of amino acids are chirality centers. Two enantiomers of each are therefore possible, but nature uses only one to build proteins. In Fischer projections, naturally occurring amino acids are represented by placing the -CO 2 - group at the top and pointing the side chain downwards, as if drawing a carbohydrate ( Section 25.2 ) and then placing the -NH 3 + group on the left. Because of their stereochemical similarity to L sugars ( Section 25.3 ), the naturally occurring α -amino acids are often referred to as L amino acids. The nonnaturally occurring enantiomers are called D amino acids.\n\nThe 20 common amino acids can be further classified as neutral, acidic, or basic, depending on the structure of their side chains. Fifteen of the twenty have neutral side chains, two (aspartic acid and glutamic acid) have an extra carboxylic acid function in their side chains, and three (lysine, arginine, and histidine) have basic amino groups in their side chains. Note that both cysteine (a thiol) and tyrosine (a phenol), although usually classified as neutral amino acids, nevertheless have weakly acidic side chains that can be deprotonated in a sufficiently basic solution.\n\nAt the physiological pH of 7.3, the side-chain carboxyl groups of aspartic acid and glutamic acid are deprotonated and the basic side-chain nitrogens of lysine and arginine are protonated. Histidine, however, which contains a heterocyclic imidazole ring in its side chain, is not quite basic enough to be protonated at pH 7.3. Note that only the pyridine-like, doubly bonded nitrogen in histidine is basic. The pyrrole-like singly bonded nitrogen is nonbasic because its lone pair of electrons is part of the six- π -electron aromatic imidazole ring ( Section 24.9 ).\n\nHumans are able to biosynthesize only 11 of the 20 protein amino acids, called nonessential amino acids. The other 9, called essential amino acids, are biosynthesized only in plants and microorganisms and must be obtained in our diet. The division between essential and nonessential amino acids is not clear-cut, however. Tyrosine, for instance, is sometimes considered nonessential because humans can produce it from phenylalanine, but phenylalanine itself is essential and must be obtained in the diet. Arginine can be synthesized by humans, but much of the arginine we need also comes from our diet.\n\nProblem 26-1 How many of the α -amino acids shown in Table 26.1 contain aromatic rings? How many contain sulfur? How many contain alcohol groups? How many contain hydrocarbon side chains? Problem 26-2 Of the 19 L amino acids, 18 have the S configuration at the α carbon. Cysteine is the only L amino acid that has an R configuration. Explain. Problem 26-3 The amino acid threonine, (2 S ,3 R )-2-amino-3-hydroxybutanoic acid, has two chirality centers. (a) Draw threonine, using normal, wedged, and dashed lines to show dimensionality. (b) Draw a diastereomer of threonine, and label its chirality centers as R or S .", "content_blocks": [{"type": "paragraph", "text": "We saw in Section 20.3 and Section 24.5 that a carboxyl group is deprotonated and exists as the carboxylate anion at a physiological pH of 7.3, while an amino group is protonated and exists as the ammonium cation. Thus, amino acids exist in aqueous solution primarily in the form of a dipolar ion, or zwitterion (from the German zwitter, meaning “hybrid”)."}, {"type": "figure", "caption": "", "image_url": "https://openstax.org/apps/image-cdn/v1/f=webp/apps/archive/20260604.144757/resources/fa9c9030e91c016258e709e1f9f37372458a1c89", "alt": "A protonated alanine reacts with water reversibly to form a zwitterion and hydronium ion. The zwitterion further reacts with water reversibly to form an anion and hydronium ion."}, {"type": "paragraph", "text": "Amino acid zwitterions are internal salts and therefore have many of the physical properties associated with salts. They have large dipole moments, are relatively soluble in water but insoluble in hydrocarbons, and are crystalline with relatively high melting points. In addition, amino acids are amphiprotic; they can react either as acids or as bases, depending on the circumstances. In aqueous acid solution, an amino acid zwitterion is a base that accepts a proton onto its -CO 2 - group to yield a cation. In aqueous base solution, the zwitterion is an acid that loses a proton from its -NH 3 + group to form an anion."}, {"type": "figure", "caption": "", "image_url": "https://openstax.org/apps/image-cdn/v1/f=webp/apps/archive/20260604.144757/resources/525b6abd131afc615c9788130289263804396799", "alt": "In acid solution, zwitter ions react with hydronium ion to form cation. In basic solution, zwitter ion reacts with a hydroxide ion to form an anion."}, {"type": "paragraph", "text": "The structures, abbreviations (both three- and one-letter), and p K a values of the 20 amino acids commonly found in proteins are shown in Table 26.1 . All are α -amino acids , meaning that the amino group in each is a substituent on the α carbon-the one next to the carbonyl group. Nineteen of the twenty amino acids are primary amines, RNH 2 , and differ only in the nature of their side chain -the substituent attached to the α carbon. Proline is a secondary amine whose nitrogen and α carbon atoms are part of a five-membered pyrrolidine ring."}, {"type": "paragraph", "text": "Table 26.1 The 20 Common Amino Acids in Proteins Name Abbreviations MW Structure p K a α -CO 2 H p K a α -NH 3 + p K a side chain p I Neutral Amino Acids Alanine Ala A 89 2.34 9.69 - 6.01 Asparagine Asn N 132 2.02 8.80 - 5.41 Cysteine Cys C 121 1.96 10.28 8.18 5.07 Glutamine Gln Q 146 2.17 9.13 - 5.65 Glycine Gly G 75 2.34 9.60 - 5.97 Isoleucine Ile I 131 2.36 9.60 - 6.02 Leucine Leu L 131 2.36 9.60 - 5.98 Methionine Met M 149 2.28 9.21 - 5.74 Phenylalanine Phe F 165 1.83 9.13 - 5.48 Proline Pro P 115 1.99 10.60 - 6.30 Serine Ser S 105 2.21 9.15 - 5.68 Threonine Thr T 119 2.09 9.10 - 5.60 Tryptophan Trp W 204 2.83 9.39 - 5.89 Tyrosine Tyr Y 181 2.20 9.11 10.07 5.66 Valine Val V 117 2.32 9.62 - 5.96 Acidic Amino Acids Aspartic acid Asp D 133 1.88 9.60 3.65 2.77 Glutamic acid Glu E 147 2.19 9.67 4.25 3.22 Basic Amino Acids Arginine Arg R 174 2.17 9.04 12.48 10.76 Histidine His H 155 1.82 9.17 6.00 7.59 Lysine Lys K 146 2.18 8.95 10.53 9.74"}, {"type": "figure", "caption": "", "image_url": "https://openstax.org/apps/image-cdn/v1/f=webp/apps/archive/20260604.144757/resources/6e25d8259b46a2ea1a6c801833af9e949afc46b9", "alt": "The structure of a generic primary alpha-amino acid, with an arrow pointing towards R, denoting the side chain  and L-proline, a secondary alpha-amino acid."}, {"type": "paragraph", "text": "In addition to the 20 amino acids commonly found in proteins, 2 others-selenocysteine and pyrrolysine-are found in some organisms, and more than 700 nonprotein amino acids are also found in nature. γ -Aminobutyric acid (GABA), for instance, is found in the brain and acts as a neurotransmitter; homocysteine is found in blood and is linked to coronary heart disease; and thyroxine is found in the thyroid gland, where it acts as a hormone."}, {"type": "figure", "caption": "", "image_url": "https://openstax.org/apps/image-cdn/v1/f=webp/apps/archive/20260604.144757/resources/6fc52d00e697486c84e2efd4a425f30ab305f425", "alt": "The structure of five amino acids. Selenocysteine and pyrrolysine are at the top whereas gamma-aminobutyric acid, homocysteine, and thyroxine are at the bottom."}, {"type": "paragraph", "text": "Except for glycine, H 2 NCH 2 CO 2 H, the α carbons of amino acids are chirality centers. Two enantiomers of each are therefore possible, but nature uses only one to build proteins. In Fischer projections, naturally occurring amino acids are represented by placing the -CO 2 - group at the top and pointing the side chain downwards, as if drawing a carbohydrate ( Section 25.2 ) and then placing the -NH 3 + group on the left. Because of their stereochemical similarity to L sugars ( Section 25.3 ), the naturally occurring α -amino acids are often referred to as L amino acids. The nonnaturally occurring enantiomers are called D amino acids."}, {"type": "figure", "caption": "", "image_url": "https://openstax.org/apps/image-cdn/v1/f=webp/apps/archive/20260604.144757/resources/af80211dfc0b5a616e2f4507943b5f65775324fd", "alt": "The structure of four amino acids from left to right, L-Serine or (S)-Serine, L-Cysteine or (R)-Cysteine, L-Alanine or (S)-Alanine, and D-Alanine or (R)-Alanine. The last structure is enclosed inside parentheses."}, {"type": "paragraph", "text": "The 20 common amino acids can be further classified as neutral, acidic, or basic, depending on the structure of their side chains. Fifteen of the twenty have neutral side chains, two (aspartic acid and glutamic acid) have an extra carboxylic acid function in their side chains, and three (lysine, arginine, and histidine) have basic amino groups in their side chains. Note that both cysteine (a thiol) and tyrosine (a phenol), although usually classified as neutral amino acids, nevertheless have weakly acidic side chains that can be deprotonated in a sufficiently basic solution."}, {"type": "paragraph", "text": "At the physiological pH of 7.3, the side-chain carboxyl groups of aspartic acid and glutamic acid are deprotonated and the basic side-chain nitrogens of lysine and arginine are protonated. Histidine, however, which contains a heterocyclic imidazole ring in its side chain, is not quite basic enough to be protonated at pH 7.3. Note that only the pyridine-like, doubly bonded nitrogen in histidine is basic. The pyrrole-like singly bonded nitrogen is nonbasic because its lone pair of electrons is part of the six- π -electron aromatic imidazole ring ( Section 24.9 )."}, {"type": "figure", "caption": "", "image_url": "https://openstax.org/apps/image-cdn/v1/f=webp/apps/archive/20260604.144757/resources/2ba22d3b8c9e91cd514260ec379cbec439bc12ef", "alt": "Ball-and-stick model with the electrostatic potential map and structure of histidine. Basic pyridine-like nitrogen, basic pyrrole-like nitrogen, and imidazole ring are labeled. Basic and nonbasic nitrogen are labeled in model."}, {"type": "paragraph", "text": "Humans are able to biosynthesize only 11 of the 20 protein amino acids, called nonessential amino acids. The other 9, called essential amino acids, are biosynthesized only in plants and microorganisms and must be obtained in our diet. The division between essential and nonessential amino acids is not clear-cut, however. Tyrosine, for instance, is sometimes considered nonessential because humans can produce it from phenylalanine, but phenylalanine itself is essential and must be obtained in the diet. Arginine can be synthesized by humans, but much of the arginine we need also comes from our diet."}, {"type": "paragraph", "text": "Problem 26-1 How many of the α -amino acids shown in Table 26.1 contain aromatic rings? How many contain sulfur? How many contain alcohol groups? How many contain hydrocarbon side chains? Problem 26-2 Of the 19 L amino acids, 18 have the S configuration at the α carbon. Cysteine is the only L amino acid that has an R configuration. Explain. Problem 26-3 The amino acid threonine, (2 S ,3 R )-2-amino-3-hydroxybutanoic acid, has two chirality centers. (a) Draw threonine, using normal, wedged, and dashed lines to show dimensionality. (b) Draw a diastereomer of threonine, and label its chirality centers as R or S ."}], "keywords": ["amino", "acids", "peptide", "protein", "carboxyl", "structure"], "lesson_ids": ["biomolecules"], "matched_terms": ["curated_lesson_mapping"]}, {"source_id": "openstax_organic_chemistry", "citation_label": "OpenStax Organic Chemistry, John McMurry, 10th edition, 28.1 Nucleotides and Nucleic Acids", "source_url": "https://openstax.org/books/organic-chemistry/pages/28-1-nucleotides-and-nucleic-acids", "license": "CC BY-NC-SA 4.0", "section_title": "28.1 Nucleotides and Nucleic Acids", "page": null, "chunk_id": "openstax_orgchem_biomolecules_28_1", "text_preview": "Nucleotides combine a sugar, phosphate, and heterocyclic base. The section supports structure-based reasoning for nucleic acids within the biomolecules syllabus.", "full_text": "Just as proteins are biopolymers made of amino acids, the nucleic acids are biopolymers made of nucleotides , joined together to form a long chain. Each nucleotide is composed of a nucleoside bonded to a phosphate group, and each nucleoside is composed of an aldopentose sugar linked through its anomeric carbon to the nitrogen atom of a heterocyclic purine or pyrimidine base.\n\nThe sugar component in RNA is ribose, and the sugar in DNA is 2′-deoxyribose. (In naming and numbering nucleotides, numbers with a prime superscript refer to positions on the sugar and numbers without a prime superscript refer to positions on the heterocyclic base. Thus, the prefix 2′-deoxy indicates that oxygen is missing from C2′ of ribose.) DNA contains four different amine bases: two substituted purines ( A , adenine, and G , guanine) and two substituted pyrimidines ( C , cytosine, and T , thymine). Adenine, guanine, and cytosine also occur in RNA, but thymine is replaced in RNA by a closely related pyrimidine base called U , uracil.\n\nThe structures of the four deoxyribonucleotides and the four ribonucleotides are shown in Figure 28.2 . Although similar chemically, DNA and RNA differ dramatically in size. Molecules of DNA are enormous, containing as many as 245 million nucleotides and having molecular weights as high as 75 billion. Molecules of RNA, by contrast, are much smaller, containing as few as 21 nucleotides and having molecular weights as low as 7000.\n\nFigure 28.2 Structures of the four deoxyribonucleotides and the four ribonucleotides.\n\nNucleotides are linked together in DNA and RNA by phosphodiester bonds [RO-(PO 2 - )-OR′] between phosphate, the 5′-hydroxyl group on one nucleoside, and the 3′-hydroxyl group on another nucleoside. One end of the nucleic acid polymer has a free hydroxyl at C3′ (the 3′ end ), and the other end has a phosphate at C5′ (the 5′ end ). The sequence of nucleotides in a chain is described by starting at the 5′ end and identifying the bases in order of occurrence, using the abbreviations G, C, A, T (or U in RNA). Thus, a typical DNA sequence might be written as TAGGCT.\n\nProblem 28-1 Draw the full structure of the DNA dinucleotide AG. Problem 28-2 Draw the full structure of the RNA dinucleotide UA.", "content_blocks": [{"type": "paragraph", "text": "Just as proteins are biopolymers made of amino acids, the nucleic acids are biopolymers made of nucleotides , joined together to form a long chain. Each nucleotide is composed of a nucleoside bonded to a phosphate group, and each nucleoside is composed of an aldopentose sugar linked through its anomeric carbon to the nitrogen atom of a heterocyclic purine or pyrimidine base."}, {"type": "figure", "caption": "", "image_url": "https://openstax.org/apps/image-cdn/v1/f=webp/apps/archive/20260604.144757/resources/0f7cf7f268ebdc83024bf4337d1d630ee7e8ee59", "alt": "D N A with nuclease and water is cleaved to nucleotides. Nucleotidase liberates phosphate from nucleotides. Resulting nucleoside liberates phosphate upon interaction with nucleosidase forming free base and pentose sugars."}, {"type": "paragraph", "text": "The sugar component in RNA is ribose, and the sugar in DNA is 2′-deoxyribose. (In naming and numbering nucleotides, numbers with a prime superscript refer to positions on the sugar and numbers without a prime superscript refer to positions on the heterocyclic base. Thus, the prefix 2′-deoxy indicates that oxygen is missing from C2′ of ribose.) DNA contains four different amine bases: two substituted purines ( A , adenine, and G , guanine) and two substituted pyrimidines ( C , cytosine, and T , thymine). Adenine, guanine, and cytosine also occur in RNA, but thymine is replaced in RNA by a closely related pyrimidine base called U , uracil."}, {"type": "figure", "caption": "", "image_url": "https://openstax.org/apps/image-cdn/v1/f=webp/apps/archive/20260604.144757/resources/da60c3c9a061a2b4329225b868567e24e6d1f31d", "alt": "The structure of ribose, 2-deoxyribose, purine, and pyrimidine. Adenine, Guanine, Cytosine and Thymine are present in D N A, whereas R N A contains Uracil instead of Thymine."}, {"type": "paragraph", "text": "The structures of the four deoxyribonucleotides and the four ribonucleotides are shown in Figure 28.2 . Although similar chemically, DNA and RNA differ dramatically in size. Molecules of DNA are enormous, containing as many as 245 million nucleotides and having molecular weights as high as 75 billion. Molecules of RNA, by contrast, are much smaller, containing as few as 21 nucleotides and having molecular weights as low as 7000."}, {"type": "figure", "caption": "Figure 28.2 Structures of the four deoxyribonucleotides and the four ribonucleotides.", "image_url": "https://openstax.org/apps/image-cdn/v1/f=webp/apps/archive/20260604.144757/resources/6feb289cc3943fe0e88a3712550272c3ba877105", "alt": "Four forms of deoxyribonucleotides are 2'-deoxyadenosine 5'-phosphate, 2'-deoxyguanosine 5'-phosphate, 2'-deoxycytidine 5'-phosphate, thymidine 5'-phosphate. Four forms of ribonucleotides are adenosine 5'-phosphate, guanosine 5'-phosphate, cytidine 5'-phosphate, uridine 5'-phosphate."}, {"type": "paragraph", "text": "Nucleotides are linked together in DNA and RNA by phosphodiester bonds [RO-(PO 2 - )-OR′] between phosphate, the 5′-hydroxyl group on one nucleoside, and the 3′-hydroxyl group on another nucleoside. One end of the nucleic acid polymer has a free hydroxyl at C3′ (the 3′ end ), and the other end has a phosphate at C5′ (the 5′ end ). The sequence of nucleotides in a chain is described by starting at the 5′ end and identifying the bases in order of occurrence, using the abbreviations G, C, A, T (or U in RNA). Thus, a typical DNA sequence might be written as TAGGCT."}, {"type": "figure", "caption": "", "image_url": "https://openstax.org/apps/image-cdn/v1/f=webp/apps/archive/20260604.144757/resources/63b82980da2632be4149a1e55570ea23dc1d50da", "alt": "Two figures show the structure of D N A. Nucleotides join together in deoxyribonucleic and ribonucleic acid via phosphate between the 5-prime on one nucleotide and the 3-prime on another."}, {"type": "paragraph", "text": "Problem 28-1 Draw the full structure of the DNA dinucleotide AG. Problem 28-2 Draw the full structure of the RNA dinucleotide UA."}], "keywords": ["nucleotides", "nucleic", "acids", "phosphate", "sugar", "heterocyclic"], "lesson_ids": ["biomolecules"], "matched_terms": ["curated_lesson_mapping"]}], "video_evidence": [{"source_id": "gate_organic_expansion_biomolecules_short_apna_sapna", "title": "Composition, Structure and Function of Biomolecules", "citation_label": "Apna Sapna JRF biomolecules structure and function lecture via VideoDB", "source_url": "https://www.youtube.com/watch?v=UEkBle3kuww", "video_id": "m-z-019f9e34-c978-7652-8e88-6a9acb307a35", " tapeptide", "tripeptides", "dipeptides"]}, {"question_id": "official_gate_cy_2024_0027", "citation_label": "Official GATE 2024 Chemistry question paper", "year": 2024, "source_url": "https://gate2026.iitg.ac.in/doc/download/2024/CY24S1.pdf", "source_path": "resources/question_banks/official_gate/gate_cy_2024_question_paper.pdf", "page": 17, "prompt_preview": "Q.23 Among the following metalloproteins, the pair(s) of non-heme proteins is (are) (A) Hemoglobin and Myoglobin (B) Hemocyanin and Carboxypeptidase (C) Hemerythrin and Carbonic anhydrase (D) Cytochrome P-450 and Hemocyanin", "keywords": ["among", "following", "metalloproteins", "pairs", "proteins", "hemoglobin", "myoglobin", "hemocyanin", "carboxypeptidase", "hemerythrin", "carbonic", "anhydrase", "cytochrome"], "matched_terms": ["cytochrome", "metalloproteins"]}], "review_prompts": ["Can you describe the relevant functional groups before naming the biomolecule class?", "Can you connect structure determination evidence to the molecule type?"], "readiness": {"state": "ready", "completeness": {"syllabus": true, "textbook": true, "video": true, "questions": true}, "source_states": {"syllabus": {"state": "source_backed", "label": "Source-backed", "message": "This lesson has processed source evidence."}, "textbook": {"state": "source_backed", "label": "Source-backed", "message": "This lesson has processed source evidence."}, "video": {"state": "source_backed", "label": "Source-backed", "message": "This lesson has processed source evidence."}, "questions": {"state": "source_backed", "label": "Source-backed", "message": "This lesson has processed source evidence."}}, "source_integrity_state": "source_backed", "evidence_completeness_score": 1.0, "missing_messages": []}, "mastery_state": "not_started"}, {"id": "experimental_techniques", "order": 7, "title": "Organic Analysis and Structural Determination", "module": "Experimental Techniques", "syllabus_anchor": "Optical rotation; chromatographic techniques including TLC, column, HPLC and GC; applications of UV-visible, IR, NMR and Mass spectrometry in structural determination of organic molecules.", "concept_thread": {"id": "nmr_structure_determination", "label": "NMR evidence for structure determination", "source_coverage": {"textbook": 2, "video": 6, "questions": 5}, "missing_source_types": [], "alignment_state": "source_backed", "alignment_score": 43.5, "evidence_ids": {"syllabus": ["experimental_techniques:syllabus"], "textbook": ["openstax_orgchem_spectroscopy_13_3", "openstax_orgchem_spectroscopy_12_1"], "video": ["gate_organic_expansion_spectroscopy_gate_chemistry:1348.50-1435.60", "gate_organic_expansion_spectroscopy_gate_chemistry:1259.54-1348.70", "gate_organic_expansion_nmr_pw:540.03-630.00", "gate_organic_expansion_nmr_pw:270.03-360.27", "gate_organic_expansion_nmr_pw:630.00-720.07", "gate_organic_expansion_spectroscopy_gate_chemistry:0.00-89.49"], "questions": ["official_gate_cy_2025_0022", "official_gate_cy_2025_0047", "official_gate_cy_2025_0050", "official_gate_cy_2025_0030", "official_gate_cy_2024_0022"]}}, "source_grounded_summary": "Study this lesson as evidence interpretation. The goal is to connect experimental data to structure, purity, stereochemistry, or functional group assignments.", "textbook_evidence": [{"source_id": "openstax_organic_chemistry", "citation_label": "OpenStax Organic Chemistry, John McMurry, 10th edition, 12.1 Mass Spectrometry of Small Molecules: Magnetic-Sector Instruments", "source_url": "https://openstax.org/books/organic-chemistry/pages/12-1-mass-spectrometry-of-small-molecules-magnetic-sector-instruments", "license": "CC BY-NC-SA 4.0", "section_title": "12.1 Mass Spectrometry of Small Molecules: Magnetic-Sector Instruments", "page": null, "chunk_id": "openstax_orgchem_spectroscopy_12_1", "text_preview": "Mass spectrometry measures molecular ions and fragment patterns. OpenStax uses it as structural evidence, aligning with the lesson's focus on interpreting organic-analysis data.", "full_text": "At its simplest, mass spectrometry (MS) is a technique for measuring the mass, and therefore the molecular weight (MW), of a molecule. In addition, it’s often possible to gain structural information about a molecule by measuring the masses of the fragments produced when molecules are broken apart.\n\nMore than 20 different kinds of commercial mass spectrometers are available depending on the intended application, but all have three basic parts: an ionization source in which sample molecules are given an electrical charge, a mass analyzer in which ions are separated by their mass-to-charge ratio, and a detector in which the separated ions are observed and counted.\n\nAmong the most common mass spectrometers used for routine purposes in the laboratory is the electron-impact, magnetic-sector instrument shown schematically in Figure 12.2 . A small amount of sample is vaporized into the ionization source, where it is bombarded by a stream of high-energy electrons. The energy of the electron beam can be varied but is commonly around 70 electron volts (eV), or 6700 kJ/mol. When a high-energy electron strikes an organic molecule, it dislodges a valence electron from the molecule, producing a cation radical - cation because the molecule has lost an electron and now has a positive charge; radical because the molecule now has an odd number of electrons.\n\nElectron bombardment transfers so much energy that most of the cation radicals fragment after formation. They break apart into smaller pieces, some of which retain the positive charge and some of which are neutral. The fragments then flow through a curved pipe in a strong magnetic field, which deflects them into different paths according to their mass-to-charge ratio ( m / z ). Neutral fragments are not deflected by the magnetic field and are lost on the walls of the pipe, but positively charged fragments are sorted by the mass spectrometer onto a detector, which records them as peaks at the various m / z ratios. Since the number of charges z on each ion is usually 1, the value of m / z for each ion is simply its mass m. Masses up to approximately 2500 atomic mass units (amu) can be analyzed by this type of instrument.\n\nFigure 12.2 Representation of an electron-ionization, magnetic-sector mass spectrometer. Molecules are ionized by collision with high-energy electrons, causing some of the molecules to fragment. Passage of the charged fragments through a magnetic field then sorts them according to their mass.\n\nAnother common type of mass spectrometer uses what is called a quadrupole mass analyzer , which has a set of four solid rods is arranged parallel to the direction of the ion beam, with an oscillating electrostatic field is generated in the space between the rods. For a given field, only one m/z value will make it through the quadrupole region. The others will crash into the rods or the walls of the instrument and never reach the detector Figure 12.3 .\n\nFigure 12.3 Representation of a quadrupole mass analyzer. Only ions of a certain m/z will reach the detector; other ions will collide with the rods.\n\nThe mass spectrum of a compound is typically presented as a bar graph, with masses ( m / z values) on the x axis and intensity, or relative abundance of ions of a given m / z striking the detector, on the y axis. The tallest peak, assigned an intensity of 100%, is called the base peak , and the peak that corresponds to the unfragmented cation radical is called the precursor peak , or the molecular ion ( M + , or simply M ). Figure 12.4 shows the mass spectrum of propane.\n\nFigure 12.4 Mass spectrum of propane (C 3 H 8 ; MW = 44).\n\nMass spectral fragmentation patterns are usually complex, and the molecular ion is often not the base peak. The mass spectrum of propane in Figure 12.4 , for instance, shows a molecular ion at m / z = 44 that is only about 30% as high as the base peak at m/z = 29. In addition, many other fragment ions are present.", "content_blocks": [{"type": "paragraph", "text": "At its simplest, mass spectrometry (MS) is a technique for measuring the mass, and therefore the molecular weight (MW), of a molecule. In addition, it’s often possible to gain structural information about a molecule by measuring the masses of the fragments produced when molecules are broken apart."}, {"type": "paragraph", "text": "More than 20 different kinds of commercial mass spectrometers are available depending on the intended application, but all have three basic parts: an ionization source in which sample molecules are given an electrical charge, a mass analyzer in which ions are separated by their mass-to-charge ratio, and a detector in which the separated ions are observed and counted."}, {"type": "figure", "caption": "", "image_url": "https://openstax.org/apps/image-cdn/v1/f=webp/apps/archive/20260604.144757/resources/46c96be1a2e862553f5c86c0b3d95522b70f5116", "alt": "A flowchart of the process of mass spectrometry. A sample moves from an ionization source to the mass analyzer, and then to the detector, after which results are displayed."}, {"type": "paragraph", "text": "Among the most common mass spectrometers used for routine purposes in the laboratory is the electron-impact, magnetic-sector instrument shown schematically in Figure 12.2 . A small amount of sample is vaporized into the ionization source, where it is bombarded by a stream of high-energy electrons. The energy of the electron beam can be varied but is commonly around 70 electron volts (eV), or 6700 kJ/mol. When a high-energy electron strikes an organic molecule, it dislodges a valence electron from the molecule, producing a cation radical - cation because the molecule has lost an electron and now has a positive charge; radical because the molecule now has an odd number of electrons."}, {"type": "figure", "caption": "", "image_url": "https://openstax.org/apps/image-cdn/v1/f=webp/apps/archive/20260604.144757/resources/c2ba06e8cdfafab9425c521ede9c1793c7b0aa56", "alt": "An organic molecule, RH loses an electron to generate a cation radical and an electron."}, {"type": "paragraph", "text": "Electron bombardment transfers so much energy that most of the cation radicals fragment after formation. They break apart into smaller pieces, some of which retain the positive charge and some of which are neutral. The fragments then flow through a curved pipe in a strong magnetic field, which deflects them into different paths according to their mass-to-charge ratio ( m / z ). Neutral fragments are not deflected by the magnetic field and are lost on the walls of the pipe, but positively charged fragments are sorted by the mass spectrometer onto a detector, which records them as peaks at the various m / z ratios. Since the number of charges z on each ion is usually 1, the value of m / z for each ion is simply its mass m. Masses up to approximately 2500 atomic mass units (amu) can be analyzed by this type of instrument."}, {"type": "figure", "caption": "Figure 12.2 Representation of an electron-ionization, magnetic-sector mass spectrometer. Molecules are ionized by collision with high-energy electrons, causing some of the molecules to fragment. Passage of the charged fragments through a magnetic field then sorts them according to their mass.", "image_url": "https://openstax.org/apps/image-cdn/v1/f=webp/apps/archive/20260604.144757/resources/314257e41081203e2183cd8969e66c1e6582eff0", "alt": "A schematic showing the curved path of a sample through a mass spectrometer from the inlet (with ionization), past a magnet (with deflection), to a detection screen."}, {"type": "paragraph", "text": "Another common type of mass spectrometer uses what is called a quadrupole mass analyzer , which has a set of four solid rods is arranged parallel to the direction of the ion beam, with an oscillating electrostatic field is generated in the space between the rods. For a given field, only one m/z value will make it through the quadrupole region. The others will crash into the rods or the walls of the instrument and never reach the detector Figure 12.3 ."}, {"type": "figure", "caption": "Figure 12.3 Representation of a quadrupole mass analyzer. Only ions of a certain m/z will reach the detector; other ions will collide with the rods.", "image_url": "https://openstax.org/apps/image-cdn/v1/f=webp/apps/archive/20260604.144757/resources/f5791b43510ab506108ce8cbbf2a41cc5be954a6", "alt": "A schematic of the jagged path of an ion beam through a space surrounded by four tubes (two positive, two negative, arranged with like charges opposite one another)."}, {"type": "paragraph", "text": "The mass spectrum of a compound is typically presented as a bar graph, with masses ( m / z values) on the x axis and intensity, or relative abundance of ions of a given m / z striking the detector, on the y axis. The tallest peak, assigned an intensity of 100%, is called the base peak , and the peak that corresponds to the unfragmented cation radical is called the precursor peak , or the molecular ion ( M + , or simply M ). Figure 12.4 shows the mass spectrum of propane."}, {"type": "figure", "caption": "Figure 12.4 Mass spectrum of propane (C 3 H 8 ; MW = 44).", "image_url": "https://openstax.org/apps/image-cdn/v1/f=webp/apps/archive/20260604.144757/resources/64d5420d8175eaaee7e326dfc95c0bb466803e37", "alt": "The mass spectrum of propane. The m / z ratios are 29 and 44 for two tall peaks noted with arrows. Other, less prevalent, peaks are also present."}, {"type": "paragraph", "text": "Mass spectral fragmentation patterns are usually complex, and the molecular ion is often not the base peak. The mass spectrum of propane in Figure 12.4 , for instance, shows a molecular ion at m / z = 44 that is only about 30% as high as the base peak at m/z = 29. In addition, many other fragment ions are present."}], "keywords": ["mass", "spectrometry", "molecular", "ion", "fragment", "spectrum", "magnetic", "sector"], "lesson_ids": ["experimental_techniques"], "matched_terms": ["curated_lesson_mapping"]}, {"source_id": "openstax_organic_chemistry", "citation_label": "OpenStax Organic Chemistry, John McMurry, 10th edition, 13.4 Chemical Shifts in 1H NMR Spectroscopy", "source_url": "https://openstax.org/books/organic-chemistry/pages/13-4-chemical-shifts-in-1h-nmr-spectroscopy", "license": "CC BY-NC-SA 4.0", "section_title": "13.4 Chemical Shifts in 1H NMR Spectroscopy", "page": null, "chunk_id": "openstax_orgchem_spectroscopy_13_3", "text_preview": "1H NMR chemical shifts connect proton environment to structure. This is direct evidence for the lesson's structural-determination workflow.", "full_text": "As mentioned previously, differences in chemical shifts are caused by the small local magnetic field of electrons surrounding different nuclei. Nuclei that are more strongly shielded by electrons require a higher applied field to bring them into resonance so they absorb on the right side of the NMR chart. Nuclei that are less strongly shielded need a lower applied field for resonance so they absorb on the left of the NMR chart.\n\nMost 1 H chemical shifts fall within the range 0 to 10 δ, which can be divided into the five regions shown in Table 13.2 . By remembering the positions of these regions, it’s often possible to tell at a glance what kinds of protons a molecule contains.\n\nTable 13.2 Regions of the 1 H NMR Spectrum\n\nTable 13.3 shows the correlation of 1 H chemical shift with electronic environment in more detail. In general, protons bonded to saturated, sp 3 -hybridized carbons absorb at higher fields, whereas protons bonded to sp 2 -hybridized carbons absorb at lower fields. Protons on carbons that are bonded to electronegative atoms, such as N, O, or halogen, also absorb at lower fields.\n\nTable 13.3 Correlation of 1 H Chemical Shifts with Environment Type of hydrogen Chemical shift ( δ ) Reference Si(C H 3 ) 4 0 Alkyl (primary) -C H 3 0.7-1.3 Alkyl (secondary) -C H 2 - 1.2-1.6 Alkyl (tertiary) 1.4-1.8 Allylic 1.6-2.2 Methyl ketone 2.0-2.4 Aromatic methyl Ar-C H 3 2.4-2.7 Alkynyl - C ≡ C - H - C ≡ C - H 2.5-3.0 Alkyl halide 2.5-4.0 Alcohol 2.5-5.0 Alcohol, ether 3.3-4.5 Vinylic 4.5-6.5 Aryl Ar- H 6.5-8.0 Aldehyde 9.7-10.0 Carboxylic acid 11.0-12.0\n\nWorked Example 13.1 Predicting Chemical Shifts in 1 H NMR Spectra Methyl 2,2-dimethylpropanoate (CH 3 ) 3 CCO 2 CH 3 has two peaks in its 1 H NMR spectrum. What are their approximate chemical shifts? Strategy Identify the types of hydrogens in the molecule, and note whether each is alkyl, vinylic, or next to an electronegative atom. Then predict where each absorbs, using Table 13.3 if necessary. Solution The -OCH 3 protons absorb around 3.5 to 4.0 δ because they are on carbon bonded to oxygen. The (CH 3 ) 3 C- protons absorb near 1.0 δ because they are typical alkane-like protons.\n\nProblem 13-6 Each of the following compounds has a single 1 H NMR peak. Approximately where would you expect each compound to absorb? (a) (b) (c) (d) (e) (f) Problem 13-7 Identify the different types of protons in the following molecule, and tell where you would expect each to absorb:", "content_blocks": [{"type": "paragraph", "text": "As mentioned previously, differences in chemical shifts are caused by the small local magnetic field of electrons surrounding different nuclei. Nuclei that are more strongly shielded by electrons require a higher applied field to bring them into resonance so they absorb on the right side of the NMR chart. Nuclei that are less strongly shielded need a lower applied field for resonance so they absorb on the left of the NMR chart."}, {"type": "paragraph", "text": "Most 1 H chemical shifts fall within the range 0 to 10 δ, which can be divided into the five regions shown in Table 13.2 . By remembering the positions of these regions, it’s often possible to tell at a glance what kinds of protons a molecule contains."}, {"type": "paragraph", "text": "Table 13.2 Regions of the 1 H NMR Spectrum"}, {"type": "paragraph", "text": "
